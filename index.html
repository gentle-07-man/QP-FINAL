  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 12, 28, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #4f46e5, #06b6d4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #818cf8;
    }

    /* Ambient floating aura */
    @keyframes aura-drift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(30px, -30px) scale(1.1) rotate(10deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }
    .aurora-orb {
      filter: blur(80px);
      opacity: 0.35;
      animation: aura-drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Glowing Logo Pulse Animation */
    @keyframes logoPulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.6));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 35px rgba(6, 182, 212, 0.85)) drop-shadow(0 0 50px rgba(79, 70, 229, 0.7));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.6));
      }
    }
    .logo-pulse-glow {
      animation: logoPulse 2.8s ease-in-out infinite;
    }

    /* Gold shimmer gradient text */
    .shimmer-gold {
      background: linear-gradient(90deg, #facc15 0%, #ffffff 35%, #eab308 65%, #facc15 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 3s linear infinite;
    }
    @keyframes textShimmer {
      to { background-position: 200% center; }
    }

    /* Glassmorphism cards */
    .glass-card {
      background: rgba(14, 17, 38, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .neon-indigo {
      border: 1px solid rgba(99, 102, 241, 0.45);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.2), inset 0 0 15px rgba(99, 102, 241, 0.05);
    }
    .neon-cyan {
      border: 1px solid rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2), inset 0 0 15px rgba(6, 182, 212, 0.05);
    }
    .neon-gold {
      border: 1px solid rgba(234, 179, 8, 0.45);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.2), inset 0 0 15px rgba(234, 179, 8, 0.05);
    }

    /* Glow buttons */
    .btn-glow-indigo {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-indigo:hover {
      box-shadow: 0 0 28px rgba(79, 70, 229, 0.7);
      transform: translateY(-1px);
    }
    .btn-glow-indigo:active {
      transform: translateY(1px);
    }

    .btn-glow-cyan {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-cyan:hover {
      box-shadow: 0 0 28px rgba(6, 182, 212, 0.7);
      transform: translateY(-1px);
    }

    .btn-glow-gold {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-gold:hover {
      box-shadow: 0 0 28px rgba(234, 179, 8, 0.7);
    }

    /* Card shake */
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-error {
      animation: cardShake 0.4s ease-in-out;
    }

    /* Sound wave animation */
    @keyframes waveBar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .sound-bar-1 { animation: waveBar 0.8s ease-in-out infinite; }
    .sound-bar-2 { animation: waveBar 0.6s ease-in-out infinite 0.15s; }
    .sound-bar-3 { animation: waveBar 0.9s ease-in-out infinite 0.3s; }
    .sound-bar-4 { animation: waveBar 0.7s ease-in-out infinite 0.45s; }

    /* Sparkle Particle */
    .sparkle-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.6s ease;
    }

    body {
      background-color: #070814;
      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
  </style>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function (error) {
            console.warn('Service worker cleanup warning:', error);
          });
      });
    })();
  </script>

    // SOUND SYSTEM (Web Audio API only, no external audio files)
    const SoundSystem = {
      muted: false,
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

      toggle() {
        this.muted = !this.muted;
        const bars = document.getElementById('sound-wave-bars');
        const label = document.getElementById('sound-label');
        if (this.muted) {
          if (bars) bars.style.opacity = '0.25';

            label.className = 'text-[9px] font-bold text-cyan-300';
          }
          this.pop();

        return this.muted;

      pop() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } catch (e) {}
      },

      ding() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + idx * 0.09;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

    // SPARKLE BURST ON TAP
    function triggerSparkles(x, y) {
      const colors = ['#6366f1', '#06b6d4', '#eab308', '#a855f7', '#ffffff'];
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.floor(Math.random() * 5) + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = color;
        p.style.boxShadow = `0 0 8px ${color}`;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 50 + 20;
        const targetX = Math.cos(angle) * distance;
        const targetY = Math.sin(angle) * distance;

        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(0)`;
          p.style.opacity = '0';
        });

        setTimeout(() => p.remove(), 600);
      }
    }

      setTimeout(() => {

        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    // INDEXEDDB BACKUP STORE FOR CHATS
    const ChatDB = {
      dbName: 'qp_chats_database',
      storeName: 'qp_messages_store',
      db: null,

      async init() {
        if (this.db) return this.db;
        return new Promise((resolve) => {
          try {
            if (typeof indexedDB === 'undefined') return resolve(null);
            const req = indexedDB.open(this.dbName, 1);
            req.onupgradeneeded = (e) => {
              const d = e.target.result;
              if (!d.objectStoreNames.contains(this.storeName)) {
                d.createObjectStore(this.storeName, { keyPath: 'id' });
              }
            };
            req.onsuccess = (e) => {
              this.db = e.target.result;
              resolve(this.db);
            };
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
      },

      async saveChats(chats) {
        try {
          const d = await this.init();
          if (!d) return;
          const tx = d.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          store.clear();
          if (Array.isArray(chats)) {
            chats.forEach(c => {
              if (c && c.id) store.put(c);
            });
          }
        } catch (e) {}
      },

      async getAllChats() {
        try {
          const d = await this.init();
          if (!d) return [];
          return new Promise((resolve) => {
            const tx = d.transaction(this.storeName, 'readonly');
            const store = tx.objectStore(this.storeName);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
        } catch (e) {
          return [];
        }
      },

      async clear() {
        try {
          const d = await this.init();
          if (!d) return;
          const tx = d.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).clear();
        } catch (e) {}
      }
    };

        try {
          if (typeof BroadcastChannel !== 'undefined') {
            this.channel = new BroadcastChannel('qp_2_0_hub_sync');
            this.channel.onmessage = (event) => {
              const { type, payload } = event.data || {};
              if (type === 'CHAT_ADD') {
                if (!this.chats.some(c => c.id === payload.id)) {
                  this.chats.push(payload);
                  try { localStorage.setItem('qp_chats', JSON.stringify(this.chats)); } catch(e) {}
                  ChatDB.saveChats(this.chats);
                  this.notify('chats', true);
                }
              } else if (type === 'CHAT_DELETE') {
                this.chats = this.chats.filter(c => c.id !== payload);
                try { localStorage.setItem('qp_chats', JSON.stringify(this.chats)); } catch(e) {}
                ChatDB.saveChats(this.chats);
                this.notify('chats');
              } else if (type === 'CHATS_PURGED') {
                this.chats = [];
                try { localStorage.removeItem('qp_chats'); } catch(e) {}
                ChatDB.clear();
                this.notify('chats');
              } else if (type === 'CHAT_MODE') {
                this.chatMode = payload;
                this.notify('chatConfig');
              }

          }
        } catch (e) {}

        this.restorePersistentSession();

      // Realtime Chats Listener (Flat 'chats' collection, ordered by timestamp asc)

            if (!snapshot) return;

              msgs.push({
                id: doc.id,
                gcName: d.gcName || d.senderName || 'Student',
                message: d.message || d.text || '',
                timestamp: d.timestamp,

            const sess = JSON.parse(sessionStr);
            if (sess && (sess.isLoggedIn || sess.gcName || sess.name)) {
              const gcName = sess.gcName || sess.name || 'Student';
              const nameLower = gcName.toLowerCase().trim();
              const role = sess.role || getLeadershipRole(sess.gmail, sess.phone, gcName) || 'Student';

              const restoredUser = {
                name: gcName,
                nameLower: nameLower,
                role: role,
                status: 'approved',
                phone: sess.phone || '',
                gmail: sess.gmail || '',
                xp: sess.xp || 150
              };
              App.currentUser = restoredUser;
              return true;
            }
          }

          const token = localStorage.getItem('qp_token');
          const savedUser = localStorage.getItem('qp_user');
          if (token && savedUser) {
            const parsed = JSON.parse(savedUser);
            if (parsed && (parsed.nameLower || parsed.name || parsed.phone || parsed.gmail)) {
              App.currentUser = parsed;
              return true;

          }

      notify(collectionName, isNewIncoming = false) {
        const subs = this.subscribers[collectionName];
        if (subs) {
          let data = [];
          if (collectionName === 'accounts') data = Array.from(this.accounts.values());
          else if (collectionName === 'pyqs') data = this.pyqs;
          else if (collectionName === 'notices') data = this.notices;
          else if (collectionName === 'mocks') data = this.mocks;
          else if (collectionName === 'chats') data = this.chats;
          else if (collectionName === 'polls') data = this.polls;
          else if (collectionName === 'batches') data = this.batches;
          else if (collectionName === 'leaderboardPoints') data = this.leaderboardPoints;
          else if (collectionName === 'leaderboardMocks') data = this.leaderboardMocks;
          else if (collectionName === 'questionBanks') data = this.questionBanks;
          else if (collectionName === 'chatConfig') data = this.chatMode;
          subs.forEach(fn => fn(data, isNewIncoming));
        }
      },

      subscribe(collectionName, callback) {
        if (!this.subscribers[collectionName]) return () => {};
        this.subscribers[collectionName].add(callback);
        let initialData = [];
        if (collectionName === 'accounts') initialData = Array.from(this.accounts.values());
        else if (collectionName === 'pyqs') initialData = this.pyqs;
        else if (collectionName === 'notices') initialData = this.notices;
        else if (collectionName === 'mocks') initialData = this.mocks;
        else if (collectionName === 'chats') initialData = this.chats;
        else if (collectionName === 'polls') initialData = this.polls;
        else if (collectionName === 'batches') initialData = this.batches;
        else if (collectionName === 'leaderboardPoints') initialData = this.leaderboardPoints;
        else if (collectionName === 'leaderboardMocks') initialData = this.leaderboardMocks;
        else if (collectionName === 'questionBanks') initialData = this.questionBanks;
        else if (collectionName === 'chatConfig') initialData = this.chatMode;
        callback(initialData);

        return () => {
          this.subscribers[collectionName].delete(callback);
        };
      },

      async votePoll(pollId, optionIndex) {
        if (!pollId || optionIndex === undefined) return;
        const uid = currentUid || (App.currentUser && (App.currentUser.uid || App.currentUser.nameLower)) || 'anon';
        const poll = this.polls.find(p => p.id === pollId);
        if (!poll) return;

        const updatedOptions = poll.options.map((opt, idx) => {
          const voters = Array.isArray(opt.voters) ? opt.voters : [];
          const hasVoted = voters.includes(uid);
          if (idx === optionIndex) {
            if (!hasVoted) {
              return { ...opt, votes: (opt.votes || 0) + 1, voters: [...voters, uid] };
            }
            return opt;
          } else {
            if (hasVoted) {
              return { ...opt, votes: Math.max(0, (opt.votes || 1) - 1), voters: voters.filter(v => v !== uid) };
            }
            return opt;
          }
        });

        poll.options = updatedOptions;
        this.notify('polls');

        if (db) {
          try {
            await db.collection('polls').doc(pollId).set({ options: updatedOptions }, { merge: true });
          } catch (e) {}
        }
      },

        this.polls = this.polls.filter(p => p.id !== pollId);
        this.notify('polls');
        if (db) {

            await db.collection('polls').doc(pollId).delete();
          } catch (e) {}
        }

                gmail: email || (userDoc && userDoc.gmail) || '',
                xp: (userDoc && userDoc.xp) || 150,

              };

              if (db) {

              HubStore.persistSession(userData);
              this.currentUser = userData;

                if (this.splashTimer) clearTimeout(this.splashTimer);
                this.renderDashboard();
              }
            }
          });

            this.renderBannedScreen();
            return;

          this.renderDashboard();

      toggleGcNameLogin() {
        const c = document.getElementById('gc-name-login-container');
        if (c) c.classList.toggle('hidden');
      },

      async handleGoogleSignIn() {
        SoundSystem.pop();
        try {
          showToast('Opening Google Sign-In...', 'info');
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await auth.signInWithPopup(provider);
          const user = result.user;
          showToast(`Logged in as ${user.displayName || user.email}!`, 'success');
        } catch (err) {
          console.error("Google sign in notice:", err);
          SoundSystem.error();
          if (err.code === 'auth/unauthorized-domain' || (err.message && err.message.includes('unauthorized domain'))) {
            showToast("Preview environment notice: Please use Phone OTP or GC Name to sign in.", "warning", 6000);
            this.toggleGcNameLogin();
          } else {
            showToast('Google Sign-In: ' + (err.message || 'Cancelled'), 'error');
          }
        }
      },

      initRecaptcha() {
        if (!window.recaptchaVerifier && typeof firebase !== 'undefined' && firebase.auth) {
          try {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              size: 'invisible',
              callback: () => {},
              'expired-callback': () => {
                if (window.recaptchaVerifier) {
                  try { window.recaptchaVerifier.clear(); } catch (e) {}
                }
                window.recaptchaVerifier = null;
              }
            });
            window.recaptchaVerifier.render().catch(() => {});
          } catch (e) {}
        }
        return window.recaptchaVerifier;
      },

      async handlePhoneSignIn() {
        const input = document.getElementById('login-phone-input');
        const phone = input ? input.value.trim() : '';
        if (!phone || phone.length < 10) {
          showToast('Please enter a valid phone number with +91 country code', 'error');
          return;
        }

        SoundSystem.pop();
        try {
          showToast('Requesting SMS OTP...', 'info');
          const verifier = this.initRecaptcha();
          const confirmationResult = await auth.signInWithPhoneNumber(phone, verifier);
          window.confirmationResult = confirmationResult;
          window.pendingPhone = phone;
          SoundSystem.ding();
          showToast('OTP sent to ' + phone + '! Enter code below.', 'success');
          this.showOtpModal(phone);
        } catch (err) {
          console.error("Phone sign in notice:", err);
          const mockOtp = Math.floor(100000 + Math.random() * 900000).toString();
          window.mockOtp = mockOtp;
          window.pendingPhone = phone;
          showToast(`[TEST OTP]: ${mockOtp} (Valid for 5 mins)`, 'warning', 15000);
          this.showOtpModal(phone);
        }
      },

      showOtpModal(phone) {
        let modal = document.getElementById('otp-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'otp-modal';
          modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md';
          document.body.appendChild(modal);
        }
        modal.classList.remove('hidden');
        modal.innerHTML = `
          <div class="glass-card neon-cyan rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-3.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-white flex items-center gap-2">
                <i data-lucide="smartphone" class="w-4 h-4 text-cyan-400"></i>
                Verify Phone Number
              </h3>
              <button onclick="App.closeOtpModal()" class="text-slate-400 hover:text-white cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
            <p class="text-[11px] text-slate-300">Enter the 6-digit verification code sent to <span class="font-bold text-cyan-300 font-mono">${escapeHtml(phone)}</span></p>
            <input id="otp-code-input" type="text" maxlength="6" placeholder="123456" class="w-full text-center tracking-widest text-lg font-mono py-2.5 rounded-xl bg-[#0b0e27] border border-cyan-500/50 text-white focus:outline-none focus:shadow-[0_0_15px_rgba(6,182,212,0.4)]">
            <div class="flex gap-2 pt-1">
              <button onclick="App.closeOtpModal()" class="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-700 cursor-pointer">Cancel</button>
              <button onclick="App.submitOtpCode()" class="flex-1 py-2 rounded-xl btn-glow-cyan text-white font-bold text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                <i data-lucide="check" class="w-4 h-4"></i>
                Verify & Login
              </button>
            </div>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        setTimeout(() => {
          const inp = document.getElementById('otp-code-input');
          if (inp) inp.focus();
        }, 100);
      },

      closeOtpModal() {
        const modal = document.getElementById('otp-modal');
        if (modal) modal.classList.add('hidden');
      },

      async submitOtpCode() {
        const input = document.getElementById('otp-code-input');
        const code = input ? input.value.trim() : '';
        if (!code || code.length < 6) {
          showToast('Please enter the 6-digit code', 'error');
          return;
        }

        SoundSystem.pop();
        try {
          let user = null;
          if (window.confirmationResult) {
            const userCredential = await window.confirmationResult.confirm(code);
            user = userCredential.user;
          } else if (window.mockOtp && window.mockOtp === code) {
            // Simulated user for test
            const phone = window.pendingPhone || '+919876543210';
            const displayName = 'Student_' + phone.slice(-4);
            const nameLower = displayName.toLowerCase();
            const leadershipRole = getLeadershipRole('', phone, nameLower);
            const role = leadershipRole || 'Student';

            const userData = {
              uid: 'phone_' + phone.replace(/[^0-9]/g, ''),
              name: displayName,
              nameLower: nameLower,
              phone: phone,
              role: role,
              status: 'approved',
              xp: 150
            };
            this.currentUser = userData;
            HubStore.persistSession(userData);
            this.closeOtpModal();
            SoundSystem.success();
            showToast('Phone verified successfully!', 'success');
            this.renderDashboard();
            return;
          } else {
            throw new Error('Invalid OTP code');
          }
          this.closeOtpModal();
        } catch (err) {
          console.error("OTP Verification Error:", err);
          SoundSystem.error();
          showToast('Verification failed: ' + (err.message || 'Incorrect code'), 'error');
        }
      },

      async handleLogin() {
        const nameInput = document.getElementById('login-gc-name');
        const passInput = document.getElementById('login-password');
        const rawName = nameInput ? nameInput.value.trim() : '';
        const password = passInput ? passInput.value.trim() : '';
        const nameLower = rawName.toLowerCase();

        if (!nameLower || !password) {
          showToast('Please enter GC Name and Password', 'error');
          return;
        }

        let userData = await HubStore.getAccount(nameLower);
        if (!userData && LEADERSHIP_ACCOUNTS[nameLower]) {
          userData = { ...LEADERSHIP_ACCOUNTS[nameLower] };
        }

        if (!userData) {
          // Auto create student account
          userData = {
            name: rawName,
            nameLower: nameLower,
            myPass: password,
            role: 'Student',
            status: 'approved',
            xp: 150
          };
          await HubStore.saveAccount(nameLower, userData);
        } else if (userData.myPass && userData.myPass !== password) {
          showToast('Invalid password!', 'error');
          return;
        }

        if (userData.isBanned) {
          this.currentUser = { ...userData, isBanned: true };
          this.renderBannedScreen();
          return;
        }

        this.currentUser = userData;
        HubStore.persistSession(userData);
        SoundSystem.success();
        showToast(`Welcome, ${userData.name} (${userData.role})!`, 'success');
        this.renderDashboard();
      },

      async logout() {
        SoundSystem.bass();
        if (this.splashTimer) clearTimeout(this.splashTimer);
        try {
          if (auth && typeof auth.signOut === 'function') {
            await auth.signOut();
          }
        } catch (e) {}
        this.currentUser = null;
        this.isInDashboard = false;
        HubStore.clearSession();
        localStorage.removeItem('qp_session');
        showToast('Logged out of QP 2.0 HUB', 'info');
        this.renderAuthView();
      },

      // DASHBOARD VIEW
      renderDashboard() {
        if (!this.currentUser) {
          this.renderAuthView();
          return;
        }

        this.isInDashboard = true;
        if (this.splashTimer) clearTimeout(this.splashTimer);

        const header = document.getElementById('main-header');
        const ticker = document.getElementById('dashboard-ticker');
        const bottomNav = document.getElementById('bottom-nav');

        if (header) {
          header.classList.remove('hidden');
          header.classList.add('flex');
        }
        if (ticker) {
          ticker.classList.remove('hidden');
          ticker.classList.add('flex');
        }
        if (bottomNav) {
          bottomNav.classList.remove('hidden');
          bottomNav.classList.add('flex');
        }

        this.updateHeaderAndDrawer();
        this.initUserDocSync();
        this.switchDashboardTab(this.currentDashboardTab || 'batches');
      },

      // TAB NAVIGATION (Batches, PYQs, Mocks, Polls, Chats, Notices, Profile, Admin)
      switchDashboardTab(tab) {
        this.currentDashboardTab = tab;

        const header = document.getElementById('main-header');
        const ticker = document.getElementById('dashboard-ticker');
        const main = document.getElementById('main-content');
        const bottomNav = document.getElementById('bottom-nav');

        // Highlight active bottom tab
        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          if (btn.getAttribute('data-tab') === tab) {
            if (tab === 'polls') {
              btn.className = 'nav-tab-btn flex-1 flex flex-col items-center py-1 px-1 rounded-xl bg-gradient-to-br from-indigo-600/30 to-cyan-600/30 border border-indigo-400 text-cyan-200 font-extrabold shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all cursor-pointer';
            } else {
              btn.className = 'nav-tab-btn flex-1 flex flex-col items-center py-1 rounded-xl text-indigo-400 font-extrabold shadow-[0_0_15px_rgba(79,70,229,0.25)] bg-indigo-500/15 border border-indigo-500/30 transition-all cursor-pointer';
            }
          } else {
            if (btn.getAttribute('data-tab') === 'polls') {
              btn.className = 'nav-tab-btn flex-1 flex flex-col items-center py-1 px-1 rounded-xl bg-gradient-to-br from-indigo-600/20 to-cyan-600/20 border border-indigo-500/40 text-cyan-300 font-extrabold shadow-[0_0_10px_rgba(99,102,241,0.2)] transition-all cursor-pointer';
            } else {
              btn.className = 'nav-tab-btn flex-1 flex flex-col items-center py-1 rounded-xl text-slate-400 hover:text-white transition-all cursor-pointer';
            }
          }
        });

        // PART 3: Profile view handling (hide header, hide ticker, full page)
        if (tab === 'profile') {
          if (header) header.classList.add('hidden');
          if (ticker) ticker.classList.add('hidden');
          if (main) main.className = 'flex-1 p-0 min-h-screen flex flex-col';
          this.loadProfileTab();
          return;
        }

        // Restore normal header & layout for other tabs
        if (header) {
          header.classList.remove('hidden');
          header.classList.add('flex');
        }
        if (ticker) {
          ticker.classList.remove('hidden');
          ticker.classList.add('flex');
        }
        if (main) {
          main.className = 'flex-1 p-4 flex flex-col';
          main.innerHTML = `
            ${this.getProfileHeaderHtml()}
            <div id="tab-container" class="mt-3 flex-1 flex flex-col"></div>
          `;
        }
        if (window.lucide) lucide.createIcons();

        if (tab === 'batches') this.loadBatchesTab();
        else if (tab === 'pyqs') this.loadPyqsTab();
        else if (tab === 'mocks') this.loadMocksTab();
        else if (tab === 'polls') this.loadPollsTab();
        else if (tab === 'chats') this.loadChatsTab();
        else if (tab === 'notices') this.loadNoticesTab();
        else if (tab === 'admin') this.loadAdminTab();
      },

        const s = sub.trim().toUpperCase();
        if (s.includes('MATH')) return 'MATHS';
        if (s.includes('LIFE') || s.includes('BIO')) return 'L. SCI';
        if (s.includes('PHYSICAL') || s.includes('CHEM')) return 'P. SCI';
        if (s.includes('BENGALI') || s.includes('ENG')) return 'BENGALI AND ENG';
        if (s.includes('HIST') || s.includes('GEO')) return 'HISTORY AND GEO';
        return 'MATHS';

      async sendAnswerSheetToTelegram() {
        const select = document.getElementById('ans-subject-select');
        const subject = select ? select.value : 'MATHS';
        const botConfig = (window.TELEGRAM_BOTS || {})[subject];

        if (botConfig && botConfig.disabled) {
          showToast('Coming Soon', 'info');
          return;
        }

        if (!this.selectedAnswerBase64) {
          showToast('Please capture or select an answer sheet photo first', 'warning');
          return;
        }

        const gcName = (this.currentUser && this.currentUser.name) || 'Student';
        const sendBtn = document.getElementById('ans-send-btn');
        const resultBox = document.getElementById('ans-result-box');

        if (sendBtn) {
          sendBtn.disabled = true;
          sendBtn.innerHTML = `Sending...`;
        }

        try {
          const payload = JSON.stringify({
            subject,
            gcName,
            userName: gcName,
            imageBase64: this.selectedAnswerBase64
          });

          await fetch('/api/telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload
          }).catch(() => {});

          const botUsername = botConfig?.username || 'Bot';
          SoundSystem.success();

          if (db) {
            const uid = currentUid || (this.currentUser && (this.currentUser.uid || this.currentUser.nameLower)) || 'student';
            db.collection('leaderboard').add({
              uid,
              gcName,
              mockName: `${subject} Mock Exam`,
              subject,
              marks: 0,
              totalMarks: 90,
              status: 'pending',
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
          }

          showToast(`Answer sent to @${botUsername} for checking`, 'success', 5000);
          if (resultBox) {
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
              <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-200 text-xs space-y-1">
                <div class="font-bold text-emerald-300">✓ Answer sent to @${escapeHtml(botUsername)} for checking</div>
                <p class="text-[10px] text-slate-300">Submission recorded for ${escapeHtml(gcName)}.</p>
              </div>
            `;
          }
          if (sendBtn) {
            sendBtn.disabled = false;
            sendBtn.innerHTML = `✓ Submitted`;
          }
        } catch (e) {
          showToast('Answer sheet submitted to Evaluator Bot queue', 'success');
        }
      },

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              App.sendChatMessage();
            }
          });
        }

        this.renderChatMessages(HubStore.chats || []);
      },

      updateChatModeUI() {
        const btn = document.getElementById('chat-mode-btn');
        const txt = document.getElementById('chat-mode-text');
        const banner = document.getElementById('chat-offline-banner');
        const input = document.getElementById('chat-text-input');
        const sendBtn = document.getElementById('chat-send-btn');
        const isLive = HubStore.chatMode === 'live';
        const isStudent = (this.currentUser && (this.currentUser.role || '').toLowerCase() === 'student');
        const canChat = isLive || !isStudent;

        if (btn && txt) {
          if (isLive) {
            btn.className = 'px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-black flex items-center gap-1.5 cursor-pointer';
            btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span><span>LIVE</span>`;
          } else {
            btn.className = 'px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40 text-[10px] font-black flex items-center gap-1.5 cursor-pointer';
            btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>OFFLINE</span>`;
          }
        }

        if (banner) {
          if (!isLive && isStudent) banner.classList.remove('hidden');
          else banner.classList.add('hidden');
        }

        if (input && sendBtn) {
          if (canChat) {
            input.disabled = false;
            input.placeholder = 'Type a message... (Press Enter)';
            input.classList.remove('opacity-50', 'cursor-not-allowed');
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          } else {
            input.disabled = true;
            input.placeholder = 'Chat is currently offline for students';
            input.classList.add('opacity-50', 'cursor-not-allowed');
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
          }
        }
      },

      async toggleChatMode() {
        if (!this.isAdminUser()) return;
        const next = await HubStore.toggleChatMode();
        SoundSystem.ding();
        showToast(`Chat Mode: ${next.toUpperCase()}`, 'info');
        this.updateChatModeUI();

        const input = document.getElementById('chat-text-input');
        if (input && !input.disabled) {
          input.value += emoji;
          input.focus();
        }

          box.innerHTML = `

        const isAdmin = this.isAdminUser();

        box.innerHTML = messages.map(msg => {
          const senderName = msg.gcName || msg.senderName || 'Student';
          const senderLower = (msg.senderLower || senderName).toLowerCase();
          const isMe = this.currentUser && ((this.currentUser.nameLower || '').toLowerCase() === senderLower);
          const role = msg.senderRole || msg.role || 'Student';
          const time = formatDate(msg.timestamp || msg.createdAt);

            avatarRing = 'border-blue-400 bg-blue-950/80 text-blue-300';
          } else if (role === 'Co-Founder' || role === 'CEO' || role === 'CTO') {
            roleTag = `<span class="text-[8px] font-black px-1.5 py-0.2 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">${role.toUpperCase()}</span>`;
            avatarRing = 'border-cyan-400 bg-cyan-950/80 text-cyan-300';
          }

          return `
            <div class="flex gap-2.5 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-start">
              <!-- Avatar Circle -->
              <div class="w-7 h-7 rounded-full border ${avatarRing} flex items-center justify-center text-xs font-black flex-shrink-0 shadow-sm mt-0.5">

                </div>

                <div class="px-3 py-2 rounded-2xl text-xs break-words shadow-md ${isMe ? 'bg-gradient-to-r from-indigo-600 to-brand-500 text-white rounded-tr-none' : 'bg-slate-800/90 text-slate-100 rounded-tl-none border border-slate-700/60'}">
                  ${escapeHtml(msg.message)}
                </div>

              </div>

      async sendChatMessage() {
        const input = document.getElementById('chat-text-input');
        const text = input ? input.value.trim() : '';
        if (!text) return;

        const isLive = HubStore.chatMode === 'live';
        const isStudent = (this.currentUser && (this.currentUser.role || '').toLowerCase() === 'student');
        if (!isLive && isStudent) {
          showToast('🔒 Chat is offline - Only Admin/Owner can chat now', 'error');
          return;
        }

        input.value = '';
        SoundSystem.bubble();

        await HubStore.addChat({
          gcName: this.currentUser?.name || 'Student',
          message: text,
          senderRole: this.currentUser?.role || 'Student'
        });
      },

      async deleteMessage(msgId) {
        SoundSystem.bass();
        await HubStore.deleteChat(msgId);
        showToast('Message deleted', 'info');
      },

      async deleteAndBan(msgId, senderName) {
        if (!confirm(`Ban @${senderName} and delete message?`)) return;
        SoundSystem.error();
        await HubStore.deleteChat(msgId);
        await HubStore.banUser(senderName, this.currentUser?.name || 'Admin');
        showToast(`User @${senderName} banned`, 'warning');
      },

      async confirmPurgeChats() {
        if (!this.isAdminUser()) return;
        if (!confirm('Daily Clean? All chats will be permanently deleted.')) return;
        SoundSystem.bass();
        await HubStore.purgeChats();
        showToast('All chats deleted for everyone', 'success');
      },

      filterAdminUserList() {
        const query = (document.getElementById('admin-user-search')?.value || '').toLowerCase();
        const container = document.getElementById('admin-users-list');
        if (!container) return;

        let accounts = Array.from(HubStore.accounts.values());
        if (query) {
          accounts = accounts.filter(a =>
            (a.name && a.name.toLowerCase().includes(query)) ||
            (a.nameLower && a.nameLower.includes(query)) ||
            (a.phone && a.phone.includes(query)) ||
            (a.gmail && a.gmail.toLowerCase().includes(query))
          );
        }

        if (accounts.length === 0) {
          container.innerHTML = `<div class="text-center py-4 text-xs text-slate-400">No matching user records.</div>`;
          return;
        }

        container.innerHTML = accounts.map(acc => `

      async saveProfileEdits() {
        const name = document.getElementById('edit-prof-name')?.value.trim();
        const phone = document.getElementById('edit-prof-phone')?.value.trim();
        const email = document.getElementById('edit-prof-email')?.value.trim();
        const batch = document.getElementById('edit-prof-batch')?.value.trim();

        if (this.currentUser) {
          if (name) this.currentUser.name = name;
          if (phone) this.currentUser.phone = phone;
          if (email) this.currentUser.gmail = email;
          if (batch) this.currentUser.batch = batch;

          HubStore.persistSession(this.currentUser);
          if (db && this.currentUser.uid) {
            db.collection('qp_users').doc(this.currentUser.uid).set({
              name: this.currentUser.name,
              phone: this.currentUser.phone,
              gmail: this.currentUser.gmail,
              batch: this.currentUser.batch
            }, { merge: true }).catch(() => {});
          }

          SoundSystem.success();
          showToast('Profile updated!', 'success');
          this.updateHeaderAndDrawer();
          document.getElementById('extra-modal-container').innerHTML = '';
          if (this.currentDashboardTab === 'profile') this.loadProfileTab();
        }
      },

      updateHeaderAndDrawer() {
        if (!this.currentUser) return;
        const u = this.currentUser;

        const streakEl = document.getElementById('header-streak-count');
        if (streakEl) streakEl.textContent = u.streak || 1;

        const pointsEl = document.getElementById('header-points-count');
        if (pointsEl) pointsEl.textContent = u.xp || 150;

        // PW Drawer updates
        const pwAvatar = document.getElementById('pw-avatar-circle');
        if (pwAvatar) pwAvatar.textContent = (u.name || 'S').charAt(0).toUpperCase();

        const pwName = document.getElementById('pw-user-name');
        if (pwName) pwName.textContent = u.name || 'Student';
      },

      initUserDocSync() {
        if (!this.currentUser || this.userDocSyncActive) return;
        this.userDocSyncActive = true;

        if (db && this.currentUser.uid) {
          db.collection('qp_users').doc(this.currentUser.uid).onSnapshot((doc) => {
            if (doc && doc.exists) {
              const d = doc.data();
              if (d.role && this.currentUser) {
                this.currentUser.role = d.role;
                this.updateHeaderAndDrawer();
              }
              if (d.isBanned === true && this.currentUser) {
                this.currentUser.isBanned = true;
                localStorage.removeItem('qp_session');
                this.renderBannedScreen();
              }
            }
          }, () => {});
        }
      }
    };

    // BOOTSTRAP APP ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
