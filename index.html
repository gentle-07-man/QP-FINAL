  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 12, 28, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #4f46e5, #06b6d4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #818cf8;
    }

    /* Ambient floating aura */
    @keyframes aura-drift {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(30px, -30px) scale(1.1) rotate(10deg); }
      100% { transform: translate(0, 0) scale(1) rotate(0deg); }
    }
    .aurora-orb {
      filter: blur(80px);
      opacity: 0.35;
      animation: aura-drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Glowing Logo Pulse Animation */
    @keyframes logoPulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.6));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 35px rgba(6, 182, 212, 0.85)) drop-shadow(0 0 50px rgba(79, 70, 229, 0.7));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.6));
      }
    }
    .logo-pulse-glow {
      animation: logoPulse 2.8s ease-in-out infinite;
    }

    /* Gold shimmer gradient text */
    .shimmer-gold {
      background: linear-gradient(90deg, #facc15 0%, #ffffff 35%, #eab308 65%, #facc15 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShimmer 3s linear infinite;
    }
    @keyframes textShimmer {
      to { background-position: 200% center; }
    }

    /* Glassmorphism cards */
    .glass-card {
      background: rgba(14, 17, 38, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .neon-indigo {
      border: 1px solid rgba(99, 102, 241, 0.45);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.2), inset 0 0 15px rgba(99, 102, 241, 0.05);
    }
    .neon-cyan {
      border: 1px solid rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2), inset 0 0 15px rgba(6, 182, 212, 0.05);
    }
    .neon-gold {
      border: 1px solid rgba(234, 179, 8, 0.45);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.2), inset 0 0 15px rgba(234, 179, 8, 0.05);
    }

    /* Glow buttons */
    .btn-glow-indigo {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-indigo:hover {
      box-shadow: 0 0 28px rgba(79, 70, 229, 0.7);
      transform: translateY(-1px);
    }
    .btn-glow-indigo:active {
      transform: translateY(1px);
    }

    .btn-glow-cyan {
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-cyan:hover {
      box-shadow: 0 0 28px rgba(6, 182, 212, 0.7);
      transform: translateY(-1px);
    }

    .btn-glow-gold {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-glow-gold:hover {
      box-shadow: 0 0 28px rgba(234, 179, 8, 0.7);
    }

    /* Card shake */
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-error {
      animation: cardShake 0.4s ease-in-out;
    }

    /* Sound wave animation */
    @keyframes waveBar {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .sound-bar-1 { animation: waveBar 0.8s ease-in-out infinite; }
    .sound-bar-2 { animation: waveBar 0.6s ease-in-out infinite 0.15s; }
    .sound-bar-3 { animation: waveBar 0.9s ease-in-out infinite 0.3s; }
    .sound-bar-4 { animation: waveBar 0.7s ease-in-out infinite 0.45s; }

    /* Sparkle Particle */
    .sparkle-particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.6s ease;
    }

    body {

      color: #f1f5f9;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

  <!-- Remove any previously installed service worker that could serve stale HTML for API routes. -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function (error) {
            console.warn('Service worker cleanup warning:', error);
          });
      });
    })();
  </script>

    // SOUND SYSTEM (Web Audio API only, no external audio files)
    const SoundSystem = {
      muted: false,
      ctx: null,

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      toggle() {
        this.muted = !this.muted;
        const bars = document.getElementById('sound-wave-bars');
        const label = document.getElementById('sound-label');
        if (this.muted) {
          if (bars) bars.style.opacity = '0.25';
          if (label) {
            label.textContent = 'MUTE';
            label.className = 'text-[10px] font-bold text-slate-500';
          }
        } else {
          if (bars) bars.style.opacity = '1';
          if (label) {
            label.textContent = 'SFX';
            label.className = 'text-[10px] font-bold text-cyan-300';
          }
          this.pop();
        }
        return this.muted;
      },

      pop() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(980, now + 0.08);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } catch (e) {}
      },

      ding() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [880, 1760].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = now + idx * 0.09;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.14, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.24);
          });
        } catch (e) {}

    // SPARKLE BURST ON TAP
    function triggerSparkles(x, y) {
      const colors = ['#6366f1', '#06b6d4', '#eab308', '#a855f7', '#ffffff'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'sparkle-particle';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.floor(Math.random() * 5) + 3;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.backgroundColor = color;
        p.style.boxShadow = `0 0 8px ${color}`;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 55 + 25;
        const targetX = Math.cos(angle) * distance;
        const targetY = Math.sin(angle) * distance;

        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${targetX}px), calc(-50% + ${targetY}px)) scale(0)`;
          p.style.opacity = '0';
        });

        setTimeout(() => p.remove(), 650);
      }
    }

    // TOAST NOTIFICATIONS
    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      
      let borderStyle = 'border-slate-700 bg-slate-900/90 text-slate-100';
      let icon = 'info';
      if (type === 'success') {
        borderStyle = 'neon-cyan bg-[#0a1b2a]/95 text-cyan-200';
        icon = 'check-circle-2';
      } else if (type === 'error') {
        borderStyle = 'neon-indigo bg-[#1c0e2a]/95 text-rose-200';
        icon = 'alert-triangle';
      } else if (type === 'warning') {
        borderStyle = 'neon-gold bg-[#261c0a]/95 text-amber-200';
        icon = 'alert-circle';
      }

      toast.className = `p-3 rounded-xl border flex items-center gap-2.5 text-xs font-semibold shadow-2xl backdrop-blur-xl transition-all duration-300 transform translate-y-[-10px] opacity-0 ${borderStyle}`;
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-4 h-4 flex-shrink-0"></i>
        <div class="flex-1">${escapeHtml(message)}</div>
      `;
      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-[-10px]', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

        return d.toLocaleDateString('en-US', {
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (e) {
        return 'Recently';

    }

      dbName: 'qp_chats_database',
      storeName: 'qp_messages_store',
      db: null,

      async init() {
        if (this.db) return this.db;
        return new Promise((resolve) => {
          try {
            if (typeof indexedDB === 'undefined') return resolve(null);
            const req = indexedDB.open(this.dbName, 1);
            req.onupgradeneeded = (e) => {
              const d = e.target.result;
              if (!d.objectStoreNames.contains(this.storeName)) {
                d.createObjectStore(this.storeName, { keyPath: 'id' });
              }
            };
            req.onsuccess = (e) => {
              this.db = e.target.result;
              resolve(this.db);
            };
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
      },

      async saveChats(chats) {
        try {
          const d = await this.init();
          if (!d) return;
          const tx = d.transaction(this.storeName, 'readwrite');
          const store = tx.objectStore(this.storeName);
          store.clear();
          if (Array.isArray(chats)) {
            chats.forEach(c => {
              if (c && c.id) store.put(c);
            });
          }
        } catch (e) {
          console.warn("ChatDB save warning:", e);
        }
      },

      async getAllChats() {
        try {
          const d = await this.init();
          if (!d) return [];
          return new Promise((resolve) => {
            const tx = d.transaction(this.storeName, 'readonly');
            const store = tx.objectStore(this.storeName);
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
        } catch (e) {
          return [];
        }
      },

      async clear() {
        try {
          const d = await this.init();
          if (!d) return;
          const tx = d.transaction(this.storeName, 'readwrite');
          tx.objectStore(this.storeName).clear();
        } catch (e) {}
      }
    };

    // ========================================================
    // RESILIENT PUBLIC SYNC & FIRESTORE DATA BRIDGE
    // Clean, empty database with persistent login & persistent chats
    // ========================================================

      accounts: new Map(),

      init() {
        // Pre-populate core leadership accounts
        Object.values(LEADERSHIP_ACCOUNTS).forEach(acc => {
          this.accounts.set(acc.nameLower, { ...acc, isBanned: false });
        });

        // Load cached chats from localStorage
        try {
          const cachedChats = localStorage.getItem('qp_chats');
          if (cachedChats) {
            const parsed = JSON.parse(cachedChats);
            if (Array.isArray(parsed) && parsed.length > 0) {
              this.chats = parsed;
            }
          }
        } catch (e) {
          console.warn("Error reading qp_chats from localStorage:", e);
        }

        // Check IndexedDB backup if localStorage was cleared
        ChatDB.getAllChats().then(idbChats => {
          if ((!this.chats || this.chats.length === 0) && Array.isArray(idbChats) && idbChats.length > 0) {
            this.chats = idbChats;
            try { localStorage.setItem('qp_chats', JSON.stringify(this.chats)); } catch(e) {}
            this.notify('chats');
          }
        }).catch(() => {});

        try {
          if (typeof BroadcastChannel !== 'undefined') {
            this.channel = new BroadcastChannel('qp_2_0_hub_sync');
            this.channel.onmessage = (event) => {
              const { type, payload } = event.data || {};
              if (type === 'ACCOUNT_UPSERT') {
                this.accounts.set(payload.nameLower, payload);
                this.notify('accounts');
              } else if (type === 'ACCOUNT_DELETE') {
                this.accounts.delete(payload);
                this.notify('accounts');
              } else if (type === 'PYQ_UPSERT') {
                const idx = this.pyqs.findIndex(p => p.id === payload.id);
                if (idx >= 0) this.pyqs[idx] = payload;
                else this.pyqs.unshift(payload);
                this.notify('pyqs');
              } else if (type === 'PYQ_DELETE') {
                this.pyqs = this.pyqs.filter(p => p.id !== payload);
                this.notify('pyqs');
              } else if (type === 'NOTICE_UPSERT') {
                const idx = this.notices.findIndex(n => n.id === payload.id);
                if (idx >= 0) this.notices[idx] = payload;
                else this.notices.unshift(payload);
                this.notify('notices');
              } else if (type === 'NOTICE_DELETE') {
                this.notices = this.notices.filter(n => n.id !== payload);
                this.notify('notices');
              } else if (type === 'MOCK_UPSERT') {
                const idx = this.mocks.findIndex(m => m.id === payload.id);
                if (idx >= 0) this.mocks[idx] = payload;
                else this.mocks.unshift(payload);
                this.notify('mocks');
              } else if (type === 'MOCK_DELETE') {
                this.mocks = this.mocks.filter(m => m.id !== payload);
                this.notify('mocks');
              } else if (type === 'CHAT_ADD') {
                if (!this.chats.some(c => c.id === payload.id)) {
                  this.chats.push(payload);
                  try { localStorage.setItem('qp_chats', JSON.stringify(this.chats)); } catch(e) {}
                  ChatDB.saveChats(this.chats);
                  this.notify('chats', true);
                }
              } else if (type === 'CHAT_DELETE') {
                this.chats = this.chats.filter(c => c.id !== payload);
                try { localStorage.setItem('qp_chats', JSON.stringify(this.chats)); } catch(e) {}
                ChatDB.saveChats(this.chats);
                this.notify('chats');
              } else if (type === 'CHATS_PURGED') {
                this.chats = [];
                try { localStorage.removeItem('qp_chats'); } catch(e) {}
                ChatDB.clear();
                this.notify('chats');
              } else if (type === 'USER_BANNED') {
                const acc = this.accounts.get(payload.nameLower);
                if (acc) {
                  acc.isBanned = true;
                  this.accounts.set(payload.nameLower, acc);
                }
                this.notify('accounts');
                if (App.currentUser && (App.currentUser.nameLower || '').toLowerCase() === payload.nameLower) {
                  App.currentUser.isBanned = true;
                  localStorage.removeItem('qp_session');
                  App.renderBannedScreen();
                }
              } else if (type === 'USER_UNBANNED') {
                const acc = this.accounts.get(payload.nameLower);
                if (acc) {
                  acc.isBanned = false;
                  this.accounts.set(payload.nameLower, acc);
                }
                this.notify('accounts');
              } else if (type === 'ROLE_UPDATED') {
                const acc = this.accounts.get(payload.nameLower);
                if (acc) {
                  acc.role = payload.role;
                  this.accounts.set(payload.nameLower, acc);
                }
                this.notify('accounts');
                if (App.currentUser && (App.currentUser.nameLower || '').toLowerCase() === payload.nameLower) {
                  App.currentUser.role = payload.role;
                }
              }
            };
          }
        } catch (e) {}

        // Check if user session exists in localStorage
        this.restorePersistentSession();

        // Real-time Firestore chats listener
        this.initChatsListener();

        // Real-time Firestore users listener
        this.initUsersListener();

        // Real-time Firestore batches listener
        this.initBatchesListener();

        // Real-time Firestore leaderboards listener
        this.initLeaderboardsListener();

        // Real-time Firestore appConfig listener
        this.initAppConfigListener();

        // Real-time Firestore question banks listener
        this.initQuestionBanksListener();

      restorePersistentSession() {
        try {
          const sessionStr = localStorage.getItem('qp_session');
          if (sessionStr) {
            const sess = JSON.parse(sessionStr);
            if (sess && (sess.isLoggedIn || sess.gcName || sess.name)) {
              const gcName = sess.gcName || sess.name || 'Student';
              const nameLower = gcName.toLowerCase().trim();
              const role = sess.role || (LEADERSHIP_ACCOUNTS[nameLower] ? LEADERSHIP_ACCOUNTS[nameLower].role : 'Student');
              
              const existingAcc = (nameLower && this.accounts.get(nameLower)) || (LEADERSHIP_ACCOUNTS[nameLower] ? { ...LEADERSHIP_ACCOUNTS[nameLower] } : null);
              const restoredUser = existingAcc ? { ...existingAcc, role: role } : {
                name: gcName,
                nameLower: nameLower,
                role: role,
                status: 'approved',
                phone: sess.phone || '',
                gmail: sess.gmail || '',
                xp: sess.xp || 150
              };
              App.currentUser = restoredUser;
              return true;
            }
          }

          const token = localStorage.getItem('qp_token');
          const savedUser = localStorage.getItem('qp_user');
          if (token && savedUser) {
            const parsed = JSON.parse(savedUser);
            if (parsed && (parsed.nameLower || parsed.name || parsed.phone || parsed.gmail)) {
              const fresh = (parsed.nameLower && this.accounts.get(parsed.nameLower)) || parsed;
              App.currentUser = fresh;
              return true;
            }
          }
        } catch (e) {
          console.warn("Error restoring session:", e);
        }
        return false;
      },

      persistSession(user, token) {
        try {
          if (user) {
            const sessionData = {
              gcName: user.name,
              role: user.role,
              isLoggedIn: true,
              loginAt: Date.now()
            };
            localStorage.setItem('qp_session', JSON.stringify(sessionData));
            localStorage.setItem('qp_user', JSON.stringify(user));
            if (token) {
              localStorage.setItem('qp_token', token);
            } else if (!localStorage.getItem('qp_token')) {
              localStorage.setItem('qp_token', 'qp_token_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8));
            }
          } else {
            localStorage.removeItem('qp_session');
            localStorage.removeItem('qp_user');
            localStorage.removeItem('qp_token');
          }
        } catch (e) {}
      },

          localStorage.clear();

      notify(collectionName, isNewIncoming = false) {
        const subs = this.subscribers[collectionName];
        if (subs) {
          let data = [];
          if (collectionName === 'accounts') data = Array.from(this.accounts.values());
          else if (collectionName === 'pyqs') data = this.pyqs;
          else if (collectionName === 'notices') data = this.notices;
          else if (collectionName === 'mocks') data = this.mocks;
          else if (collectionName === 'chats') data = this.chats;
          else if (collectionName === 'batches') data = this.batches;
          else if (collectionName === 'leaderboardPoints') data = this.leaderboardPoints;
          else if (collectionName === 'leaderboardMocks') data = this.leaderboardMocks;
          else if (collectionName === 'questionBanks') data = this.questionBanks;
          subs.forEach(fn => fn(data, isNewIncoming));
        }
      },

      subscribe(collectionName, callback) {
        if (!this.subscribers[collectionName]) return () => {};
        this.subscribers[collectionName].add(callback);
        let initialData = [];
        if (collectionName === 'accounts') initialData = Array.from(this.accounts.values());
        else if (collectionName === 'pyqs') initialData = this.pyqs;
        else if (collectionName === 'notices') initialData = this.notices;
        else if (collectionName === 'mocks') initialData = this.mocks;
        else if (collectionName === 'chats') initialData = this.chats;
        else if (collectionName === 'batches') initialData = this.batches;
        else if (collectionName === 'leaderboardPoints') initialData = this.leaderboardPoints;
        else if (collectionName === 'leaderboardMocks') initialData = this.leaderboardMocks;
        else if (collectionName === 'questionBanks') initialData = this.questionBanks;
        callback(initialData);

        return () => {
          this.subscribers[collectionName].delete(callback);
        };
      },

      async deleteChat(msgId) {
        this.chats = this.chats.filter(c => c.id !== msgId);
        try {
          localStorage.setItem('qp_chats', JSON.stringify(this.chats));
        } catch (e) {}
        ChatDB.saveChats(this.chats);
        this.notify('chats');

        if (this.channel) {
          this.channel.postMessage({ type: 'CHAT_DELETE', payload: msgId });
        }

        if (db) {
          try {
            await db.collection('chats').doc(msgId).delete();
            const subDocs = await db.collection('chats').doc('general_adda').collection('messages').where('id', '==', msgId).get();

          } catch (e) {}
        }

      async purgeChats() {
        this.chats = [];
        try {
          localStorage.removeItem('qp_chats');
        } catch (e) {}
        ChatDB.clear();
        this.notify('chats');

        if (this.channel) {
          this.channel.postMessage({ type: 'CHATS_PURGED' });
        }

        if (db) {
          try {
            const subSnap = await db.collection("chats").doc("general_adda").collection("messages").get();
            const batch1 = db.batch();
            subSnap.forEach(d => batch1.delete(d.ref));
            await batch1.commit();

            const snap = await db.collection('chats').get();
            const batch2 = db.batch();
            snap.forEach(doc => {
              if (doc.id !== 'general_adda') {
                batch2.delete(doc.ref);
              }
            });
            await batch2.commit();
          } catch (e) {
            console.warn("Purge firestore error:", e);
          }
        }
      },

      initAutoPurgeChecker() {

            // Check current time in IST (Asia/Kolkata)
            const nowIST = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
            const hours = nowIST.getHours();
            const dateKey = nowIST.toDateString();

            const lastPurged = localStorage.getItem('qp_last_autopurge_date');
            if (hours === 0 && lastPurged !== dateKey) {
              localStorage.setItem('qp_last_autopurge_date', dateKey);
              HubStore.purgeChats();
              showToast("Auto-Purge Daily: All chats cleared for 12 AM IST", "info", 5000);
            }
          } catch (e) {
            console.warn("Auto purge check error:", e);
          }
        };

        runCheck();
        if (this.autoPurgeInterval) clearInterval(this.autoPurgeInterval);
        this.autoPurgeInterval = setInterval(runCheck, 60000);

              const displayName = user.displayName || (user.phoneNumber ? 'Student_' + user.phoneNumber.slice(-4) : (email ? email.split('@')[0] : 'Student'));

      // 3. AUTH METHODS (Client-Side, Netlify-Compatible)
      // Google Sign-In using signInWithPopup
      async handleGoogleSignIn() {
        SoundSystem.pop();
        try {
          showToast('Opening Google Sign-In...', 'info');
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          const result = await auth.signInWithPopup(provider);
          const user = result.user;
          const token = (await user.getIdToken()) || ('qp_google_token_' + Date.now());

          const email = user.email || '';
          const displayName = user.displayName || email.split('@')[0] || 'Student';
          const nameLower = displayName.toLowerCase().replace(/[^a-z0-9_]/g, '_');

          // Check if designated leadership role
          let role = 'Student';
          if (nameLower === 'haider' || email.toLowerCase().includes('haider')) role = 'Owner';
          else if (nameLower === 'aritra' || email.toLowerCase().includes('aritra')) role = 'Co-Founder';
          else if (nameLower === 'ranbir' || email.toLowerCase().includes('ranbir')) role = 'CEO';
          else if (nameLower === 'gentleman' || email.toLowerCase().includes('gentleman')) role = 'CTO';

          // 3. BAN SYSTEM: Check if user is banned
          const isBanned = await HubStore.checkIsUserBanned(nameLower);
          if (isBanned) {
            this.currentUser = { name: displayName, nameLower: nameLower, role: role, isBanned: true };
            localStorage.removeItem('qp_session');
            this.renderBannedScreen();
            return;
          }

          const userData = {
            name: displayName,
            nameLower: nameLower,
            role: role,
            status: 'approved',
            phone: user.phoneNumber || '',
            gmail: email,
            xp: 150,
            authProvider: 'google'
          };

          // 1. PERSISTENT LOGIN: Save user data to localStorage as qp_session, qp_user & qp_token
          const sessionData = {
            gcName: displayName,
            role: role,
            isLoggedIn: true,
            loginAt: Date.now()
          };
          localStorage.setItem('qp_session', JSON.stringify(sessionData));
          localStorage.setItem('qp_user', JSON.stringify(userData));
          localStorage.setItem('qp_token', token);
          HubStore.persistSession(userData, token);
          this.currentUser = userData;
          this.isInDashboard = true;

          await HubStore.saveAccount(nameLower, userData);

          SoundSystem.success();
          showToast(`Welcome, ${displayName} (${role})!`, 'success');
          this.renderDashboard();
        } catch (err) {
          console.error("Google Sign-In Error:", err);
          SoundSystem.error();

          const code = err.code || '';
          const msg = (err.message || '').toLowerCase();

          if (code === 'auth/unauthorized-domain' || msg.includes('unauthorized domain') || msg.includes('unauthorized-domain') || msg.includes('auth/unauthorized-domain')) {
            showToast("Preview e Google login hobe na, Live site e hobe. GC Name diye login koro.", "warning", 6500);

            // Fallback to GC Name login
            if (this.currentAuthTab !== 'login') {
              this.switchAuthTab('login');
            }
            setTimeout(() => {
              const gcInput = document.getElementById('login-gc-name');
              if (gcInput) {
                gcInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                gcInput.focus();
                gcInput.classList.add('ring-2', 'ring-amber-400', 'bg-amber-500/10');
                setTimeout(() => {
                  gcInput.classList.remove('ring-2', 'ring-amber-400', 'bg-amber-500/10');
                }, 3000);
              }
            }, 150);
          } else {
            showToast('Google Sign-In: ' + (err.message || 'Authentication cancelled'), 'error');
          }
        }
      },

      // Phone Number authentication using signInWithPhoneNumber with invisible RecaptchaVerifier
      initRecaptcha() {
        if (!window.recaptchaVerifier && typeof firebase !== 'undefined' && firebase.auth) {
          try {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              size: 'invisible',
              callback: () => {},
              'expired-callback': () => {
                if (window.recaptchaVerifier) {
                  try { window.recaptchaVerifier.clear(); } catch (e) {}
                }
                window.recaptchaVerifier = null;
              }
            });
            window.recaptchaVerifier.render().catch(e => console.warn(e));
          } catch (e) {
            console.warn("Recaptcha verifier notice:", e);
          }
        }
        return window.recaptchaVerifier;
      },

      async handlePhoneSignIn() {
        const input = document.getElementById('login-phone-input');
        const phone = input ? input.value.trim() : '';
        if (!phone || phone.length < 10) {
          showToast('Please enter a valid phone number with +91 country code', 'error');
          return;
        }

        SoundSystem.pop();
        try {
          showToast('Requesting SMS OTP...', 'info');
          const verifier = this.initRecaptcha();
          const confirmationResult = await auth.signInWithPhoneNumber(phone, verifier);
          window.confirmationResult = confirmationResult;
          window.pendingPhone = phone;
          SoundSystem.ding();
          showToast('OTP sent to ' + phone + '! Enter code below.', 'success');
          this.showOtpModal(phone);
        } catch (err) {
          console.error("Phone sign in error:", err);
          if (window.recaptchaVerifier) {
            try { window.recaptchaVerifier.clear(); } catch (e) {}
            window.recaptchaVerifier = null;
          }

          // Fallback test code if Firebase SMS quota/billing is not enabled
          const mockOtp = Math.floor(100000 + Math.random() * 900000).toString();
          window.mockOtp = mockOtp;
          window.pendingPhone = phone;
          showToast(`[TEST OTP]: ${mockOtp} (Valid for 5 mins)`, 'warning', 15000);
          this.showOtpModal(phone);
        }
      },

      closeOtpModal() {

      async submitOtpCode() {
        const input = document.getElementById('otp-code-input');
        const code = input ? input.value.trim() : '';
        if (!code || code.length < 6) {
          showToast('Please enter the 6-digit code', 'error');
          return;
        }

        SoundSystem.pop();
        try {
          let token = 'qp_phone_token_' + Date.now();
          if (window.confirmationResult) {
            const userCredential = await window.confirmationResult.confirm(code);
            const user = userCredential.user;
            token = (await user.getIdToken()) || token;
          } else if (window.mockOtp && window.mockOtp === code) {
            // Simulated OTP verified
          } else {
            throw new Error('Invalid OTP code');
          }

          const phone = window.pendingPhone || '+91';
          const name = 'Student_' + phone.slice(-4);
          const nameLower = name.toLowerCase();

          // 3. BAN SYSTEM: Check if phone user is banned
          const isBanned = await HubStore.checkIsUserBanned(nameLower);
          if (isBanned) {
            this.currentUser = { name: name, nameLower: nameLower, role: 'Student', isBanned: true };
            localStorage.removeItem('qp_session');
            this.closeOtpModal();
            this.renderBannedScreen();
            return;
          }

          const userData = {
            name: name,
            nameLower: nameLower,
            phone: phone,
            role: 'Student',
            status: 'approved',
            xp: 120,
            authProvider: 'phone'
          };

          // 1. PERSISTENT LOGIN: Save user data to localStorage as qp_session, qp_user & qp_token
          const sessionData = {
            gcName: name,
            role: 'Student',
            isLoggedIn: true,
            loginAt: Date.now()
          };
          localStorage.setItem('qp_session', JSON.stringify(sessionData));
          localStorage.setItem('qp_user', JSON.stringify(userData));
          localStorage.setItem('qp_token', token);
          HubStore.persistSession(userData, token);
          this.currentUser = userData;
          this.isInDashboard = true;

          await HubStore.saveAccount(nameLower, userData);
          this.closeOtpModal();
          SoundSystem.success();
          showToast('Phone verified successfully!', 'success');
          this.renderDashboard();
        } catch (err) {
          console.error("OTP Verification Error:", err);
          SoundSystem.error();
          showToast('Verification failed: ' + (err.message || 'Incorrect code'), 'error');
        }
      },

      // LOGIN SUBMISSION (Persistent via localStorage qp_user & qp_token)
      async handleLogin() {
        const nameInput = document.getElementById('login-gc-name');
        const passInput = document.getElementById('login-password');

        const rawName = nameInput ? nameInput.value.trim() : '';
        const password = passInput ? passInput.value.trim() : '';
        const nameLower = rawName.toLowerCase();

        if (!nameLower || !password) {
          this.triggerCardShake();
          showToast('Please enter both GC Name and Password', 'error');
          return;
        }

        try {
          showToast('Authenticating with Hub...', 'info');
          let userData = await HubStore.getAccount(nameLower);

          // If leadership account, ensure initialized
          if (!userData && LEADERSHIP_ACCOUNTS[nameLower]) {
            userData = { ...LEADERSHIP_ACCOUNTS[nameLower] };
            await HubStore.saveAccount(nameLower, userData);
          }

          if (!userData) {
            this.triggerCardShake();
            showToast('Account not found! Check your GC Name.', 'error');
            return;
          }

          if (userData.myPass !== password) {
            this.triggerCardShake();
            showToast('Invalid password! Please try again.', 'error');
            return;
          }

          // 3. BAN SYSTEM: Check if GC Name account is banned
          const isBanned = await HubStore.checkIsUserBanned(nameLower);
          if (isBanned || userData.isBanned === true) {
            SoundSystem.error();
            this.triggerCardShake();
            this.currentUser = { ...userData, id: nameLower, isBanned: true };
            localStorage.removeItem('qp_session');
            this.renderBannedScreen();
            return;
          }

          if (userData.status !== 'approved') {
            SoundSystem.error();
            this.triggerCardShake();
            showToast('Account is PENDING approval from an Owner or Admin.', 'warning', 5000);
            return;
          }

          // 1. PERSISTENT LOGIN: Save to localStorage as qp_session, qp_user & qp_token
          this.currentUser = { ...userData, id: nameLower };
          const token = 'qp_token_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
          const sessionData = {
            gcName: this.currentUser.name,
            role: this.currentUser.role,
            isLoggedIn: true,
            loginAt: Date.now()
          };
          localStorage.setItem('qp_session', JSON.stringify(sessionData));
          localStorage.setItem('qp_user', JSON.stringify(this.currentUser));
          localStorage.setItem('qp_token', token);
          HubStore.persistSession(this.currentUser, token);
          this.isInDashboard = true;

          SoundSystem.success();
          showToast(`Welcome, ${this.currentUser.name} (${this.currentUser.role})!`, 'success');
          this.renderDashboard();
        } catch (err) {
          this.triggerCardShake();
          showToast('Login failed: ' + err.message, 'error');
        }
      },

      // CREATE ACCOUNT (Prevents everyone becoming owner)
      async handleCreateAccount() {
        const nameInput = document.getElementById('reg-gc-name');
        const passInput = document.getElementById('reg-password');
        const keyInput = document.getElementById('reg-role-key');
        const phoneInput = document.getElementById('reg-phone');
        const gmailInput = document.getElementById('reg-gmail');

        const rawName = nameInput ? nameInput.value.trim() : '';
        const myPass = passInput ? passInput.value.trim() : '';
        const rawKey = keyInput ? keyInput.value.trim().toUpperCase() : '';
        const phone = phoneInput ? phoneInput.value.trim() : '';
        const gmail = gmailInput ? gmailInput.value.trim() : '';

        const nameLower = rawName.toLowerCase().replace(/[^a-z0-9_]/g, '');

        if (!nameLower || nameLower.length < 3) {
          this.triggerCardShake();
          showToast('GC Name must be at least 3 letters or numbers', 'error');
          return;
        }

        if (myPass.length < 6) {
          this.triggerCardShake();
          showToast('Personal Password must be at least 6 characters', 'error');
          return;
        }

        if (!phone.startsWith('+91') || phone.length < 13) {
          this.triggerCardShake();
          showToast('Valid +91 phone number is mandatory', 'error');
          return;
        }

        if (!gmail || !gmail.includes('@')) {
          this.triggerCardShake();
          showToast('Valid Email address is mandatory', 'error');
          return;
        }

        try {
          const existingAcc = await HubStore.getAccount(nameLower);
          if (existingAcc) {
            this.triggerCardShake();
            showToast(`GC Name "${nameLower}" is already taken!`, 'error');
            return;
          }

          // STRICT ROLE ASSIGNMENT: Prevents everyone becoming Owner
          let role = 'Student'; // Default role for everyone!
          let autoApproved = false;

          if (nameLower === 'haider') {
            role = 'Owner';
            autoApproved = true;
          } else if (nameLower === 'aritra') {
            role = 'Co-Founder';
            autoApproved = true;
          } else if (nameLower === 'ranbir') {
            role = 'CEO';
            autoApproved = true;
          } else if (nameLower === 'gentleman') {
            role = 'CTO';
            autoApproved = true;
          } else if (rawKey === 'QP2.0OWNER@2026' || rawKey === 'QP2.0HUBOWNER@2026') {
            role = 'Owner';
            autoApproved = true;
          } else if (rawKey === 'QP2.0ADMIN@2026' || rawKey === 'QP2.0HUBADMIN@2026') {
            role = 'Admin';
            autoApproved = true;
          } else {
            // General Student Registration
            role = 'Student';
            autoApproved = true; // Instant access for students
          }

          const newAccountData = {
            name: rawName,
            nameLower: nameLower,
            myPass: myPass,
            role: role,
            status: autoApproved ? 'approved' : 'pending',
            phone: phone,
            gmail: gmail,
            xp: 100,
            createdAt: new Date()
          };

          await HubStore.saveAccount(nameLower, newAccountData);

          SoundSystem.success();
          showToast(`Account registered as ${role}! Please log in.`, 'success', 4000);
          this.switchAuthTab('login');
        } catch (err) {
          this.triggerCardShake();
          showToast('Registration error: ' + err.message, 'error');
        }
      },

      // RESET PASSWORD
      async handleResetPassword() {
        const nameInput = document.getElementById('reset-gc-name');
        const contactInput = document.getElementById('reset-contact');
        const passInput = document.getElementById('reset-new-password');

        const rawName = nameInput ? nameInput.value.trim() : '';
        const contact = contactInput ? contactInput.value.trim().toLowerCase() : '';
        const newPass = passInput ? passInput.value.trim() : '';
        const nameLower = rawName.toLowerCase();

        if (!nameLower || !contact || !newPass) {
          this.triggerCardShake();
          showToast('All fields are required to reset password', 'error');
          return;
        }

        if (newPass.length < 6) {
          this.triggerCardShake();
          showToast('New password must be at least 6 characters', 'error');
          return;
        }

        try {
          const acc = await HubStore.getAccount(nameLower);
          if (!acc) {
            this.triggerCardShake();
            showToast('Account not found with this GC Name', 'error');
            return;
          }

          const phoneMatch = acc.phone && acc.phone.includes(contact);
          const gmailMatch = acc.gmail && acc.gmail.toLowerCase() === contact;

          if (!phoneMatch && !gmailMatch) {
            this.triggerCardShake();
            showToast('Contact does not match registered details', 'error');
            return;
          }

          await HubStore.updateAccountPassword(nameLower, newPass);
          SoundSystem.success();
          showToast('Password updated successfully! Please login.', 'success');
          this.switchAuthTab('login');
        } catch (err) {
          this.triggerCardShake();
          showToast('Reset error: ' + err.message, 'error');
        }
      },

      triggerCardShake() {
        SoundSystem.error();
        const card = document.getElementById('auth-card');
        if (card) {
          card.classList.remove('shake-error');
          void card.offsetWidth;
          card.classList.add('shake-error');
        }
      },

      // 5. LOGOUT (Firebase signOut(), clears qp_session & all localStorage, navigates to Login page)
      async logout() {
        SoundSystem.bass();
        this.cleanupListeners();
        if (this.splashTimer) clearTimeout(this.splashTimer);
        try {
          if (auth && typeof auth.signOut === 'function') {
            await auth.signOut();
          }
        } catch (e) {
          console.warn("SignOut notice:", e);
        }
        this.currentUser = null;
        this.isInDashboard = false;
        HubStore.clearSession();
        localStorage.removeItem('qp_session');
        localStorage.clear();
        showToast('Logged out of QP 2.0 HUB', 'info');
        this.renderAuthView();
      },

      cleanupListeners() {
        this.unsubs.forEach(unsub => {
          if (typeof unsub === 'function') unsub();
        });
        this.unsubs = [];
      },

      filterPyqs(subject) {
        this.currentPyqFilter = subject;
        document.querySelectorAll('.pyq-filter-btn').forEach(btn => {
          if (btn.getAttribute('data-subject') === subject) {
            btn.className = 'pyq-filter-btn px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold whitespace-nowrap';
          } else {
            btn.className = 'pyq-filter-btn px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 font-medium whitespace-nowrap';
          }
        });

        if (!this.pyqsData) return;
        if (subject === 'All') {
          this.renderPyqList(this.pyqsData);
        } else {
          this.renderPyqList(this.pyqsData.filter(p => p.subject === subject));

      mapSubjectToBotKey(sub) {
        if (!sub) return 'MATHS';
        const s = sub.trim().toUpperCase();
        if (s === 'MATHS' || s.includes('MATH')) return 'MATHS';
        if (s === 'L. SCI' || s.includes('LIFE') || s.includes('BIO')) return 'L. SCI';
        if (s === 'P. SCI' || s.includes('PHYSICAL') || s.includes('PHY') || s.includes('CHEM')) return 'P. SCI';
        if (s === 'BENGALI AND ENG' || s.includes('BENG') || s.includes('ENG')) return 'BENGALI AND ENG';
        if (s === 'HISTORY AND GEO' || s.includes('HIST') || s.includes('GEO')) return 'HISTORY AND GEO';
        return 'MATHS';
      },

        this.openMockAttemptScreen(mock);

      handleAnswerSheetFileChange(input) {
        if (!input || !input.files || !input.files[0]) return;
        const file = input.files[0];

        if (!file.type.startsWith('image/')) {
          showToast('Please select a valid image file', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          this.selectedAnswerBase64 = e.target.result;

          const previewCont = document.getElementById('ans-preview-container');
          const previewImg = document.getElementById('ans-preview-img');
          const infoSpan = document.getElementById('ans-preview-info');

          if (previewImg) previewImg.src = this.selectedAnswerBase64;
          if (infoSpan) infoSpan.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
          if (previewCont) previewCont.classList.remove('hidden');

          SoundSystem.pop();
          lucide.createIcons();
        };
        reader.readAsDataURL(file);
      },

        if (previewImg) previewImg.src = '';

      async sendAnswerSheetToTelegram() {
        const select = document.getElementById('ans-subject-select');
        const subject = select ? select.value : 'MATHS';

        const bots = window.TELEGRAM_BOTS || {
          'MATHS': { username: 'El_examinador_bot', envToken: 'MATHS_BOT_TOKEN' },
          'L. SCI': { username: 'life_ico_bot', envToken: 'LSCI_BOT_TOKEN' },
          'P. SCI': { username: 'Therealitusbot', envToken: 'PSCI_BOT_TOKEN' },
          'BENGALI AND ENG': { username: 'Benglish_k_bot', envToken: 'BENGALI_BOT_TOKEN' },
          'HISTORY AND GEO': { username: '', envToken: 'HISTORY_BOT_TOKEN', disabled: true }
        };

        const botConfig = bots[subject];
        if (botConfig && botConfig.disabled) {
          showToast('Coming Soon', 'info');
          return;
        }

        if (!this.selectedAnswerBase64) {
          SoundSystem.error();
          showToast('Please capture or choose an answer sheet photo first', 'warning');
          return;
        }

        // Get gcName from localStorage.getItem('qp_user')
        let gcName = 'Student';
        try {
          const rawUser = localStorage.getItem('qp_user');
          if (rawUser) {
            const parsed = JSON.parse(rawUser);
            gcName = parsed.name || parsed.gcName || parsed.displayName || 'Student';
          }
        } catch (e) {
          gcName = (this.currentUser && this.currentUser.name) || 'Student';
        }

        const sendBtn = document.getElementById('ans-send-btn');
        const resultBox = document.getElementById('ans-result-box');

        if (sendBtn) {
          sendBtn.disabled = true;
          sendBtn.innerHTML = `
            <span class="inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            Sending to @${botConfig?.username || 'Bot'}...
          `;
        }

        SoundSystem.pop();

        try {
          let response;
          const payload = JSON.stringify({
            subject: subject,
            gcName: gcName,
            userName: gcName,
            imageBase64: this.selectedAnswerBase64,
            photo_base64: this.selectedAnswerBase64
          });
          const reqHeaders = { 'Content-Type': 'application/json' };

          try {
            response = await fetch('/api/telegram', {
              method: 'POST',
              headers: reqHeaders,
              body: payload
            });
            if (!response.ok && response.status === 404) {
              response = await fetch('/.netlify/functions/sendToTelegram', {
                method: 'POST',
                headers: reqHeaders,
                body: payload
              });
            }
          } catch (fetchErr) {
            response = await fetch('/.netlify/functions/sendToTelegram', {
              method: 'POST',
              headers: reqHeaders,
              body: payload
            });
          }

          const responseText = await response.text();
          let data;
          try {
            data = JSON.parse(responseText);
          } catch (parseError) {
            console.error('Telegram endpoint returned non-JSON:', response.status, responseText.slice(0, 200));
            data = { error: 'The Telegram endpoint returned HTML instead of JSON. Redeploy the function and clear the site cache.' };
          }

          if (!response.ok || data.error) {
            if (data.disabled || (data.error && data.error.includes('Coming Soon'))) {
              showToast('Coming Soon', 'info');
            } else {
              showToast(data.error || 'Failed to submit answer sheet', 'error');
            }
            if (sendBtn) {
              sendBtn.disabled = false;
              sendBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Retry Send`;
              lucide.createIcons();
            }
            return;
          }

          const botUsername = data.botUsername || botConfig?.username || 'Bot';
          SoundSystem.success();

          // 1. Record attempt in collection 'leaderboard' with status 'pending'
          if (db) {
            try {
              const uid = currentUid || (this.currentUser && (this.currentUser.uid || this.currentUser.nameLower)) || 'student';
              await db.collection('leaderboard').add({
                uid: uid,
                gcName: gcName,
                mockName: `${subject} Mock Examination`,
                subject: subject,
                marks: 0,
                totalMarks: 90,
                status: 'pending',
                batchId: (this.currentUser && this.currentUser.batch) || 'General',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
            } catch(e) {
              console.warn("Attempt logging error:", e);
            }
          }

          // Show success: "Answer sent to @botUsername for checking"
          showToast(`Answer sent to @${botUsername} for checking`, 'success', 6000);

          if (resultBox) {
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = `
              <div class="p-3.5 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-200 text-xs space-y-2">
                <div class="flex items-center gap-2 font-black text-emerald-300">
                  <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                  Answer sent to @${escapeHtml(botUsername)} for checking
                </div>
                <p class="text-[11px] text-slate-300">
                  Submission logged for <span class="font-bold text-white">${escapeHtml(gcName)}</span> (${escapeHtml(subject)}). The evaluator bot has received your answer sheet photo.
                </p>
                <div class="flex items-center justify-between pt-1">
                  <a href="https://t.me/${escapeHtml(botUsername)}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1 rounded-lg bg-cyan-600/30 text-cyan-300 border border-cyan-500/40 text-[10px] font-bold inline-flex items-center gap-1 hover:bg-cyan-600/50">
                    <i data-lucide="send" class="w-3 h-3"></i>
                    Open @${escapeHtml(botUsername)}
                  </a>
                  <button type="button" onclick="App.clearAnswerSheetPreview(); document.getElementById('ans-result-box').classList.add('hidden');" class="text-[10px] text-slate-400 hover:text-white underline">
                    Submit another photo
                  </button>
                </div>
              </div>
            `;
            lucide.createIcons();
          }

          if (sendBtn) {
            sendBtn.disabled = false;
            sendBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-300"></i> Submitted!`;
            lucide.createIcons();
          }
        } catch (err) {
          console.error("sendToTelegram error:", err);
          SoundSystem.error();
          showToast('Network error: ' + (err.message || 'Could not connect to Netlify function'), 'error');
          if (sendBtn) {
            sendBtn.disabled = false;
            sendBtn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Send Answer Sheet`;
            lucide.createIcons();
          }
        }
      },

            roleTag = '<span class="px-1.5 py-0.2 rounded text-[9px] font-black bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">CEO</span>';
          } else if (role === 'CTO') {
            roleTag = '<span class="px-1.5 py-0.2 rounded text-[9px] font-black bg-purple-500/20 text-purple-300 border border-purple-500/40">CTO</span>';
          } else if (role === 'Admin') {
            roleTag = '<span class="px-1.5 py-0.2 rounded text-[9px] font-black bg-blue-500/20 text-blue-300 border border-blue-500/40">ADMIN</span>';
          } else {
            roleTag = '<span class="px-1.5 py-0.2 rounded text-[9px] font-semibold bg-emerald-500/20 text-emerald-300">STUDENT</span>';
          }

          // 2. ADMIN UI - Long press / 3-dot on any message (only visible if current user role == 'owner' or 'admin')
          const adminMenuBtn = isAdmin ? `
            <button onclick="App.openMessageAdminModal('${msg.id}', '${safeName}', '${safeRole}')" class="p-1 rounded text-slate-400 hover:text-white hover:bg-slate-700/60 transition-colors ml-1 cursor-pointer flex-shrink-0" title="Admin Options">
              <i data-lucide="more-vertical" class="w-3.5 h-3.5"></i>

            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <div class="flex items-center gap-1.5 mb-0.5 text-[10px]">
                <span class="font-bold ${isMe ? 'text-indigo-300' : 'text-slate-300'}">${escapeHtml(senderName)}</span>

                <span class="text-[9px] text-slate-400 font-mono">${timeDisplay}</span>
              </div>
              <div class="flex items-center gap-1 max-w-[88%]">
                <div 
                  class="chat-bubble-content px-3 py-2 rounded-2xl text-xs break-words shadow-sm ${isMe ? 'bg-gradient-to-r from-indigo-600 to-brand-500 text-white rounded-tr-none' : 'bg-slate-800/90 text-slate-100 rounded-tl-none border border-slate-700/60'}"

                  ${escapeHtml(textContent)}
                </div>
                ${adminMenuBtn}
              </div>

          box.querySelectorAll('.chat-bubble-content[data-msg-id]').forEach(el => {

            el.addEventListener('touchstart', () => {
              pressTimer = setTimeout(() => {
                const id = el.getAttribute('data-msg-id');
                const sender = el.getAttribute('data-sender');
                const r = el.getAttribute('data-role');
                SoundSystem.ding();
                App.openMessageAdminModal(id, sender, r);
              }, 500);
            }, { passive: true });
            el.addEventListener('touchend', () => { if (pressTimer) clearTimeout(pressTimer); }, { passive: true });
            el.addEventListener('touchmove', () => { if (pressTimer) clearTimeout(pressTimer); }, { passive: true });
            el.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              const id = el.getAttribute('data-msg-id');
              const sender = el.getAttribute('data-sender');
              const r = el.getAttribute('data-role');
              App.openMessageAdminModal(id, sender, r);

      },

      async sendChatMessage() {
        const input = document.getElementById('chat-text-input');
        const text = input ? input.value.trim() : '';
        if (!text) return;

        input.value = '';
        SoundSystem.bubble();

        try {
          // Check if current user is banned
          if (this.currentUser) {
            const isBanned = await HubStore.checkIsUserBanned(this.currentUser.nameLower);
            if (isBanned || this.currentUser.isBanned) {
              this.currentUser.isBanned = true;
              localStorage.removeItem('qp_session');
              this.renderBannedScreen();
              return;
            }
          }

          // 1 & 2. Save to localStorage 'qp_chats' AND Firestore 'qp_messages' + 'chats'
          await HubStore.addChat({
            gcName: this.currentUser ? this.currentUser.name : 'Student',
            message: text,
            senderRole: this.currentUser ? this.currentUser.role : 'Student',
            senderLower: this.currentUser ? this.currentUser.nameLower : 'student'
          });
        } catch (e) {
          showToast('Failed to send: ' + e.message, 'error');
        }
      },

        await HubStore.deleteChat(msgId);
        this.closeMessageAdminModal();
        showToast('Message deleted for everyone', 'info');
      },

      async deleteAndBanUser(msgId, senderName) {
        if (!confirm(`Are you sure you want to delete message AND ban @${senderName} from QP 2.0 HUB?`)) return;
        SoundSystem.error();
        await HubStore.deleteChat(msgId);
        await HubStore.banUser(senderName, this.currentUser ? this.currentUser.name : 'Admin');
        this.closeMessageAdminModal();
        showToast(`User @${senderName} has been banned and message deleted`, 'warning', 5000);

      async promoteToAdmin(senderName) {
        if (!this.isOwnerUser()) {
          showToast('Only Owner can promote users to Admin', 'error');
          return;
        }
        if (!confirm(`Promote @${senderName} to Admin?`)) return;
        SoundSystem.ding();
        await HubStore.makeAdmin(senderName);
        this.closeMessageAdminModal();
        showToast(`User @${senderName} is now an Admin!`, 'success');
      },

      // 4. PURGE SYSTEM
      async confirmPurgeChats() {
        if (!this.isAdminUser()) {
          showToast('Only Owner or Admin can purge chats', 'error');
          return;
        }
        const ok = confirm("Daily clean? All chats will be deleted");
        if (!ok) return;

        SoundSystem.bass();
        showToast('Purging all chats from QP HUB...', 'info');
        await HubStore.purgeChats();
        showToast('All chats deleted for everyone', 'success');
      },

        const isCurrent = localStorage.getItem('qp_autopurge') === 'true';

        localStorage.setItem('qp_autopurge', nextState ? 'true' : 'false');
        SoundSystem.pop();
        showToast(`Auto-Purge (Daily 12 AM IST): ${nextState ? 'ENABLED' : 'DISABLED'}`, nextState ? 'success' : 'info');
        const btn = document.getElementById('autopurge-toggle-btn');

                    Reset Pass

                  ${isOwnerOrFounder && !isSelf ? `

                <div class="flex items-center gap-1">
                  ${!isSelf ? `
                    ${isBanned ? `

      // Cross-device sync on user document & activity logger
      userDocSyncActive: false,
      initUserDocSync() {
        if (!this.currentUser || this.userDocSyncActive) return;
        this.userDocSyncActive = true;

        const uidKey = this.currentUser.uid || this.currentUser.nameLower || 'student';

        // 1. Cross-Device sync on Firestore 'users' collection
        if (db) {
          try {
            const unsub = db.collection('users').doc(uidKey).onSnapshot((docSnap) => {
              if (docSnap && docSnap.exists) {
                const data = docSnap.data();
                if (data.avatarUrl) this.currentUser.avatarUrl = data.avatarUrl;
                if (data.batch) this.currentUser.batch = data.batch;
                if (data.class) this.currentUser.class = data.class;
                if (data.city) this.currentUser.city = data.city;
                if (data.phone && !this.currentUser.phone) this.currentUser.phone = data.phone;
                if (data.streak !== undefined) this.currentUser.streak = data.streak;
                if (data.points !== undefined) this.currentUser.points = data.points;
                if (data.role && data.role !== this.currentUser.role) this.currentUser.role = data.role;
                this.updateHeaderAndDrawer();
              }
            }, (err) => {
              console.warn("User doc sync notice:", err.message);
            });
            this.unsubs.push(unsub);
          } catch(e) {}
        }

        // 2. Log Login in userLogs collection
        HubStore.logUserActivity({
          name: this.currentUser.name,
          nameLower: this.currentUser.nameLower,
          role: this.currentUser.role,
          gmail: this.currentUser.gmail || '',
          phone: this.currentUser.phone || '',
          action: 'LOGIN',
          device: navigator.userAgent || 'Web Browser'
        });
      },

      handleAvatarUpload(input) {
        if (!input || !input.files || !input.files[0]) return;
        const file = input.files[0];
        if (!file.type.startsWith('image/')) {
          showToast('Please select a valid image file', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          const base64 = e.target.result;
          this.currentUser.avatarUrl = base64;
          const preview = document.getElementById('profile-modal-avatar-preview');
          if (preview) preview.src = base64;
          this.updateHeaderAndDrawer();
          SoundSystem.pop();
          showToast('Photo uploaded! Tap "Save Profile Updates" to persist.', 'info');
        };
        reader.readAsDataURL(file);
      },

      async saveProfileChanges() {
        const nameInput = document.getElementById('prof-input-name')?.value.trim();
        const emailInput = document.getElementById('prof-input-email')?.value.trim();
        const phoneInput = document.getElementById('prof-input-phone')?.value.trim();
        const cityInput = document.getElementById('prof-input-city')?.value.trim();
        const classInput = document.getElementById('prof-input-class')?.value;
        const batchInput = document.getElementById('prof-input-batch')?.value;

        if (nameInput) this.currentUser.name = nameInput;
        if (emailInput) this.currentUser.gmail = emailInput;
        if (phoneInput) this.currentUser.phone = phoneInput;
        if (cityInput) this.currentUser.city = cityInput;
        if (classInput) this.currentUser.class = classInput;
        if (batchInput) this.currentUser.batch = batchInput;

        try {
          localStorage.setItem('qp_user', JSON.stringify(this.currentUser));
          const session = JSON.parse(localStorage.getItem('qp_session') || '{}');
          session.gcName = this.currentUser.name;
          session.phone = this.currentUser.phone;
          session.gmail = this.currentUser.gmail;
          localStorage.setItem('qp_session', JSON.stringify(session));

          if (db) {
            const uidKey = this.currentUser.uid || this.currentUser.nameLower || 'student';
            await db.collection('users').doc(uidKey).set({
              name: this.currentUser.name,
              nameLower: this.currentUser.nameLower,
              gmail: this.currentUser.gmail || '',
              phone: this.currentUser.phone || '',
              city: this.currentUser.city || '',
              class: this.currentUser.class || '',
              batch: this.currentUser.batch || '',
              avatarUrl: this.currentUser.avatarUrl || '',
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
          }
        } catch(e) {
          console.warn("Save profile notice:", e);
        }

        SoundSystem.success();
        showToast('Profile updated successfully!', 'success');
        this.updateHeaderAndDrawer();
        document.getElementById('extra-modal-container').innerHTML = '';
      },

      async deleteAccountSelf() {
        if (!confirm('Are you sure you want to permanently delete your account? All progress, streak, and access will be removed.')) return;
        SoundSystem.bass();
        try {
          if (db && this.currentUser) {
            const uidKey = this.currentUser.uid || this.currentUser.nameLower;
            await db.collection('users').doc(uidKey).delete().catch(() => {});
            await db.collection('qp_users').doc(this.currentUser.nameLower).delete().catch(() => {});
          }
        } catch(e) {}
        showToast('Account deleted', 'info');
        this.logout();
      },

      async submitSupportTicket() {
        const subject = (document.getElementById('modal-ticket-subject') || document.getElementById('ticket-subject'))?.value.trim();
        const message = (document.getElementById('modal-ticket-message') || document.getElementById('ticket-message'))?.value.trim();
        const uid = currentUid || (this.currentUser && (this.currentUser.uid || this.currentUser.nameLower)) || 'student';
        const gcName = (this.currentUser && this.currentUser.name) || 'Student';
        const email = (this.currentUser && (this.currentUser.gmail || this.currentUser.email)) || 'user@qp2hub.com';

        if (!subject || !message) {
          showToast('Subject and Message are required', 'error');
          return;
        }

        const btn = document.getElementById('modal-ticket-btn') || document.getElementById('ticket-submit-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<span class="inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Submitting...`;
        }

        const ticketData = {
          uid: uid,
          email: email,
          gcName: gcName,
          subject: subject,
          message: message,
          status: 'open',
          createdAt: new Date().toISOString()
        };

        // 1. Add to Firestore collection "supportTickets"
        if (db) {
          try {
            await db.collection("supportTickets").add({
              ...ticketData,
              timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
          } catch(e) {
            console.warn("Firestore supportTickets error:", e);
          }
        }

        // 2. POST to /api/support.js
        try {
          await fetch('/api/support.js', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ticketData)
          });
        } catch(e) {
          console.warn("API support forward notice:", e);
        }

        SoundSystem.success();
        showToast('Ticket raised successfully! Forwarded to support bot.', 'success');
        this.openSupportModal();
      },
