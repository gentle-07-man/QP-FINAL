        }
        await HubStore.makeAdmin(name);
        SoundSystem.success();
        showToast(`User @${name} is now an Admin!`, 'success');
        document.getElementById('extra-modal-container').innerHTML = '';
      },

      async openManageSocialsModal() {
        if (!this.canManage()) return;
        SoundSystem.pop();
        const modal = document.getElementById('extra-modal-container');
        if (!modal) return;

        const socials = await HubStore.getSocials();

        modal.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3.5 overflow-y-auto">
            <div class="glass-card neon-indigo rounded-2xl p-5 w-full max-w-[420px] space-y-3.5 my-auto max-h-[92vh] overflow-y-auto no-scrollbar shadow-2xl">
              <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                  <i data-lucide="settings" class="w-5 h-5 text-purple-400"></i>
                  <div>
                    <h3 class="text-xs font-black text-white font-display tracking-wider uppercase">MANAGE SOCIALS & SUPPORT EMAIL</h3>
                    <p class="text-[10px] text-slate-400">Owner Config Center (config/socials)</p>
                  </div>
                </div>
                <button onclick="document.getElementById('extra-modal-container').innerHTML=''" class="text-slate-400 hover:text-white p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="space-y-2.5 text-xs">
                <div>
                  <label class="block text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-1">Official Support Email</label>
                  <input id="cfg-support-email" type="email" value="${escapeHtml(socials.supportEmail || 'support@qp2hub.com')}" class="w-full bg-[#0d1029] border border-emerald-500/50 rounded-xl px-3 py-2 text-xs text-white">
                </div>

                <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Official Telegram URL</label>
                  <input id="cfg-telegram" type="url" value="${escapeHtml(socials.telegram || 'https://t.me/UPDATES_01')}" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>

                <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">YouTube Channel URL</label>
                  <input id="cfg-youtube" type="url" value="${escapeHtml(socials.youtube || '')}" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>

                <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Instagram URL</label>
                  <input id="cfg-instagram" type="url" value="${escapeHtml(socials.instagram || '')}" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>

                <div>
                  <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">WhatsApp Group URL</label>
                  <input id="cfg-whatsapp" type="url" value="${escapeHtml(socials.whatsapp || '')}" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                </div>

                <button onclick="App.saveSocialsConfig()" class="w-full btn-glow-indigo py-2.5 rounded-xl font-bold text-xs text-white flex items-center justify-center gap-1.5 mt-2">
                  <i data-lucide="check" class="w-4 h-4"></i>
                  SAVE SOCIALS & SUPPORT EMAIL
                </button>
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      async saveSocialsConfig() {
        const supportEmail = document.getElementById('cfg-support-email')?.value.trim();
        const telegram = document.getElementById('cfg-telegram')?.value.trim();
        const youtube = document.getElementById('cfg-youtube')?.value.trim();
        const instagram = document.getElementById('cfg-instagram')?.value.trim();
        const whatsapp = document.getElementById('cfg-whatsapp')?.value.trim();

        await HubStore.saveSocials({
          supportEmail: supportEmail || 'support@qp2hub.com',
          telegram: telegram || 'https://t.me/UPDATES_01',
          youtube: youtube || '',
          instagram: instagram || '',
          whatsapp: whatsapp || ''
        });

        SoundSystem.success();
        showToast('Socials and Support Email updated!', 'success');
        document.getElementById('extra-modal-container').innerHTML = '';
      },

      // CONFIGURE 6TH TAB
      openConfigureSixthTabModal() {
        if (!this.canManage()) return;
        SoundSystem.pop();
        const modal = document.getElementById('extra-modal-container');
        if (!modal) return;

        const cfg = HubStore.appConfig || { sixthTabName: 'Coming Soon', sixthTabEnabled: false, sixthTabLink: '' };

        modal.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-card neon-gold rounded-2xl p-5 w-full max-w-[390px] space-y-3.5 shadow-2xl">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                <h3 class="text-sm font-extrabold text-white flex items-center gap-1.5 font-display">
                  <i data-lucide="layout" class="w-4 h-4 text-amber-400"></i>
                  Configure 6th Bottom Nav Tab
                </h3>
                <button onclick="document.getElementById('extra-modal-container').innerHTML=''" class="text-slate-400 hover:text-white p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-1">6th Tab Name (e.g. Doubt Box, Live, Quiz)</label>
                <input id="cfg-sixth-name" type="text" value="${escapeHtml(cfg.sixthTabName || 'Coming Soon')}" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-1">Custom Action Link (URL or empty for popup)</label>
                <input id="cfg-sixth-link" type="text" value="${escapeHtml(cfg.sixthTabLink || '')}" placeholder="https://... or leave empty" class="w-full bg-[#0d1029] border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
              </div>

              <div class="flex items-center gap-2 pt-1">
                <input id="cfg-sixth-enabled" type="checkbox" ${cfg.sixthTabEnabled ? 'checked' : ''} class="w-4 h-4 rounded text-amber-500">
                <label for="cfg-sixth-enabled" class="text-xs font-bold text-white">Enable Custom Function / Link</label>
              </div>

              <button onclick="App.saveSixthTabConfig()" class="w-full btn-glow-gold py-2.5 rounded-xl font-bold text-xs text-white flex items-center justify-center gap-1.5 mt-2">
                <i data-lucide="check" class="w-4 h-4"></i>
                UPDATE 6TH TAB
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
      },

      async saveSixthTabConfig() {
        const name = document.getElementById('cfg-sixth-name')?.value.trim();
        const link = document.getElementById('cfg-sixth-link')?.value.trim();
        const enabled = document.getElementById('cfg-sixth-enabled')?.checked || false;

        const newConfig = {
          sixthTabName: name || 'Coming Soon',
          sixthTabLink: link || '',
          sixthTabEnabled: enabled
        };

        if (db) {
          try {
            await db.collection("config").doc("appConfig").set(newConfig, { merge: true });
          } catch(e) {}
        }
        HubStore.appConfig = newConfig;
        this.updateSixthTabButton();

        SoundSystem.success();
        showToast('6th Tab updated!', 'success');
        document.getElementById('extra-modal-container').innerHTML = '';
      },

      updateSixthTabButton() {
        const label = document.getElementById('nav-sixth-tab-label');
        if (label) {
          label.textContent = (HubStore.appConfig && HubStore.appConfig.sixthTabName) || 'Coming Soon';
        }
      },

      handleSixthTabClick() {
        SoundSystem.pop();
        const cfg = HubStore.appConfig || { sixthTabName: 'Coming Soon', sixthTabEnabled: false, sixthTabLink: '' };

        if (cfg.sixthTabEnabled && cfg.sixthTabLink) {
          try {
            window.open(cfg.sixthTabLink, '_blank');
          } catch(e) {}
          return;
        }

        // Show Coming Soon popup
        const modal = document.getElementById('extra-modal-container');
        if (!modal) return;

        modal.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-card neon-gold rounded-2xl p-6 w-full max-w-[360px] text-center space-y-3 shadow-2xl">
              <div class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center justify-center mx-auto text-xl font-black">
                ✨
              </div>
              <h3 class="text-base font-black text-white font-display tracking-wide uppercase">
                ${escapeHtml(cfg.sixthTabName || 'COMING SOON')}
              </h3>
              <p class="text-xs text-slate-300 leading-relaxed">
                This academic feature is currently under active development by our education council. Stay tuned for official bulletins!
              </p>
              <button onclick="document.getElementById('extra-modal-container').innerHTML=''" class="w-full py-2.5 rounded-xl btn-glow-indigo text-white font-bold text-xs mt-2">
                Understood
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
      },



      // 17. ADMIN-ONLY USER LOGS MODAL
      // ========================================================
      async openUserLogsModal() {
        if (!this.canManage()) {
          showToast('Access restricted to staff only', 'error');
          return;
        }

        SoundSystem.pop();
        const modal = document.getElementById('extra-modal-container');
        if (!modal) return;

        const logs = await HubStore.getUserLogs(30);

        modal.innerHTML = `
          <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3.5 overflow-y-auto">
            <div class="glass-card neon-indigo rounded-2xl p-5 w-full max-w-[440px] space-y-3.5 my-auto max-h-[92vh] overflow-y-auto no-scrollbar shadow-2xl">
              
              <!-- Header -->
              <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center gap-2">
                  <div class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center justify-center font-black">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <h3 class="text-xs font-black text-white font-display tracking-wider uppercase">USER LOGIN ACTIVITY LOGS</h3>
                    <p class="text-[10px] text-slate-400">Real-Time Access History (Firestore: userLogs)</p>
                  </div>
                </div>
                <button onclick="document.getElementById('extra-modal-container').innerHTML=''" class="text-slate-400 hover:text-white p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- Log Entries -->
              <div class="space-y-2 max-h-[60vh] overflow-y-auto no-scrollbar font-mono text-[10px]">
                ${logs.length === 0 ? `
                  <div class="text-center py-8 text-slate-400">No login logs recorded yet.</div>
                ` : logs.map(l => `
                  <div class="p-2.5 rounded-xl bg-[#0b0e27] border border-slate-800 space-y-1">
                    <div class="flex items-center justify-between text-slate-300">
                      <span class="font-bold text-white flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                        ${escapeHtml(l.name || l.nameLower || 'User')}
                      </span>
                      <span class="px-1.5 py-0.2 rounded text-[9px] font-black bg-indigo-500/20 text-indigo-300">${escapeHtml(l.role || 'Student')}</span>
                    </div>
                    <div class="text-[9px] text-slate-400 flex items-center justify-between">
                      <span>${escapeHtml(l.gmail || l.phone || 'Local Session')}</span>
                      <span>${formatDate(l.timestamp)}</span>
                    </div>
                    <div class="text-[8px] text-slate-500 truncate">${escapeHtml(l.device || 'Browser')}</div>
                  </div>
                `).join('')}
              </div>

            </div>
          </div>
        `;
        lucide.createIcons();
      },

      // ========================================================
      // 18. MOCK TEST ADMIN CONTROLS (STOP / ANSWER KEY)
      // ========================================================
      async toggleMockStatus(id, currentStatus) {
        SoundSystem.bass();
        const nextStatus = await HubStore.toggleMockStatus(id, currentStatus);
        showToast(`Mock test marked as ${nextStatus.toUpperCase()}!`, nextStatus === 'stopped' ? 'warning' : 'success');
        this.switchDashboardTab('mocks');
      },

      async promptAddAnswerKey(id) {
        const item = HubStore.mocks.find(m => m.id === id);
        const currentKey = item?.answerKeyUrl || '';
        const url = prompt('Enter Google Drive or PDF link for the Answer Key:', currentKey);
        if (url === null) return;
        
        await HubStore.setMockAnswerKey(id, url.trim());
        SoundSystem.ding();
        showToast('Answer Key updated!', 'success');
        this.switchDashboardTab('mocks');
      }
    };

    // BOOTSTRAP APP ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
