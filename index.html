    const firebaseConfig = {

      storageBucket: "qp-2-0-hub-09012011.firebasestorage.app",
      messagingSenderId: "121603897628",
      appId: "1:121603897628:web:cfa31e4a0c7b652c32a2d9",
      measurementId: "G-1VBD4XWFE1"
    };

    let app = null;
    let auth = null;
    let db = null;

    try {
      if (!firebase.apps.length) {
        app = firebase.initializeApp(firebaseConfig);
      } else {
        app = firebase.app();
      }
      auth = firebase.auth();
      db = firebase.firestore();
      
      // CRITICAL: Set persistent Auth state across reloads & sessions
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn("Persistence error:", e));
    } catch (e) {
      console.error("Firebase init failed:", e);
    }

    // --- 2. AUDIO FEEDBACK SYSTEM ---
    const SoundSystem = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      beep(freq, duration, type = 'sine') {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      success() { this.beep(587.33, 0.12); setTimeout(() => this.beep(880, 0.22), 90); },
      error() { this.beep(220, 0.2, 'sawtooth'); },
      pop() { this.beep(660, 0.08); },
      ding() { this.beep(987.77, 0.25); }
    };

    // --- 3. TOAST NOTIFICATIONS ---
    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      let borderClass = 'border-indigo-500/40 text-indigo-200 bg-slate-900/95';
      let icon = 'info';

      if (type === 'success') {
        borderClass = 'border-emerald-500/50 text-emerald-200 bg-slate-900/95';
        icon = 'check-circle-2';
      } else if (type === 'error') {
        borderClass = 'border-rose-500/50 text-rose-200 bg-slate-900/95';
        icon = 'alert-triangle';
      } else if (type === 'warning') {
        borderClass = 'border-amber-500/50 text-amber-200 bg-slate-900/95';
        icon = 'alert-circle';
      }

      toast.className = `p-3 rounded-2xl border ${borderClass} shadow-2xl flex items-center gap-2.5 text-xs font-semibold backdrop-blur-md pointer-events-auto transition-all transform duration-300 opacity-0 -translate-y-2 max-w-sm w-full`;
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-4 h-4 flex-shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;

      container.appendChild(toast);
      lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(ts) {
      if (!ts) return 'Recent';
      if (typeof ts.toDate === 'function') return ts.toDate().toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const d = new Date(ts);
      return isNaN(d) ? 'Recent' : d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

            const sessionRaw = localStorage.getItem('qp_session');

      async onUserLoggedIn(firebaseUser) {
        const uid = firebaseUser.uid;
        const email = firebaseUser.email || '';
        const displayName = firebaseUser.displayName || 'Student';
        const photoURL = firebaseUser.photoURL || '/logo.png';

        // Check if user is banned first
        const isBanned = await this.checkUserBan(uid, email, displayName);
        if (isBanned) {
          await auth.signOut();
          localStorage.removeItem('qp_session');
          this.renderBannedScreen();
          return;
        }

        // Setup real-time listener for user profile from Firestore "users"
        await this.setupUserDataListener(uid, displayName, email, photoURL);

        // Record User Login Log in Firestore "user_logs" (Cross-device tracking)
        this.recordUserLoginLog(uid);

      async checkUserBan(uid, email, name) {
        if (!db) return false;
        try {
          const doc = await db.collection('qp_users').doc(uid).get();
          if (doc.exists && doc.data().isBanned === true) return true;
          if (name) {
            const nameDoc = await db.collection('qp_users').doc(name.toLowerCase().trim()).get();
            if (nameDoc.exists && nameDoc.data().isBanned === true) return true;
          }
        } catch (e) {}
        return false;
      },

      async setupUserDataListener(uid, fallbackName = 'Student', fallbackEmail = '', fallbackPhoto = '/logo.png') {
        if (this.userUnsub) this.userUnsub();

        const userDocRef = db.collection('users').doc(uid);
        
        // Initial get or create
        try {
          const snap = await userDocRef.get();
          if (!snap.exists) {
            const initialData = {
              uid: uid,
              name: fallbackName,
              nameLower: fallbackName.toLowerCase().trim(),
              email: fallbackEmail,
              photoURL: fallbackPhoto,
              role: (fallbackName.toLowerCase() === 'haider' || fallbackEmail.includes('haider')) ? 'Owner' : 'Student',
              phone: '',
              city: 'Kolkata',
              userClass: 'Class 10',
              batch: 'Alpha Batch',
              streak: 1,
              points: 25,
              lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await userDocRef.set(initialData, { merge: true });
          }
        } catch (e) {
          console.warn("User doc setup error:", e);
        }

        // Real-time onSnapshot for UID-based Firestore sync across Phone A and Phone B!
        this.userUnsub = userDocRef.onSnapshot((doc) => {
          if (doc && doc.exists) {
            const data = doc.data();
            this.currentUser = {
              uid: uid,
              ...data,
              role: data.role || 'Student',
              streak: data.streak || 1,
              points: data.points || 25,
              batch: data.batch || 'General'
            };

            // Save to localStorage as secondary backup
            try {
              localStorage.setItem('qp_session', JSON.stringify({
                uid: uid,
                gcName: this.currentUser.name,
                role: this.currentUser.role,
                isLoggedIn: true,
                loginAt: Date.now()
              }));
              localStorage.setItem('qp_user', JSON.stringify(this.currentUser));
            } catch (e) {}

            this.updateHeaderUi();
          }
        });
      },

            phone: this.currentUser.phone || 'N/A',

            batch: this.currentUser.batch || 'General',
            device: navigator.userAgent || 'Unknown Device',

      async handleGoogleSignIn() {
        SoundSystem.pop();

      async handlePhoneSignIn() {

          showToast('Please enter a valid phone number with country code', 'error');
          return;
        }

        try {
          if (!window.recaptchaVerifier) {
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
              size: 'invisible'
            });
          }
          showToast('Sending OTP to ' + phone + '...', 'info');
          const confirmation = await auth.signInWithPhoneNumber(phone, window.recaptchaVerifier);
          const code = prompt(`Enter 6-digit OTP sent to ${phone}:`);
          if (code) {
            await confirmation.confirm(code);
            SoundSystem.success();
            showToast('Phone verified successfully!', 'success');
          }
        } catch (e) {
          console.error("Phone sign-in error:", e);
          showToast(e.message || 'Phone OTP verification failed', 'error');

      handleAnswerSheetPicked(input) {
        if (!input || !input.files || !input.files[0]) return;
        const file = input.files[0];

        if (!file.type.startsWith('image/')) {
          showToast('Please select an image file', 'error');
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          let base64 = e.target.result;
          // Ensure it has data:image/jpeg;base64, or similar prefix
          if (!base64.startsWith('data:image/')) {
            base64 = 'data:image/jpeg;base64,' + base64;
          }
          this.selectedAnswerBase64 = base64;

          const box = document.getElementById('ans-preview-box');
          const img = document.getElementById('ans-preview-img');
          const info = document.getElementById('ans-file-info');

          if (img) img.src = base64;
          if (info) info.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
          if (box) box.classList.remove('hidden');

          SoundSystem.pop();
          lucide.createIcons();
        };
        reader.readAsDataURL(file);
      },

      clearAnswerSheetPreview() {
        this.selectedAnswerBase64 = null;
        const box = document.getElementById('ans-preview-box');
        const img = document.getElementById('ans-preview-img');
        const file = document.getElementById('ans-photo-file');
        if (img) img.src = '';
        if (file) file.value = '';
        if (box) box.classList.add('hidden');
      },

      async submitAnswerSheetToApi() {
        const select = document.getElementById('ans-subject');
        const subject = select ? select.value : 'MATHS';

        if (subject === 'HIST_GEO') {
          showToast('History & Geography evaluator is pending. Coming Soon!', 'info');
          return;
        }

        if (!this.selectedAnswerBase64) {
          SoundSystem.error();
          showToast('Please capture or choose an answer sheet photo first', 'warning');
          return;
        }

        const userName = (this.currentUser && this.currentUser.name) || 'Student';
        const userId = (this.currentUser && this.currentUser.uid) || 'Anonymous';
        const batch = (this.currentUser && this.currentUser.batch) || 'General';

        const submitBtn = document.getElementById('ans-submit-btn');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = `
            <span class="inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            Sending to Bot...
          `;
        }

        SoundSystem.pop();

        try {
          // Robust fetch call with safe JSON parsing to avoid syntax error
          const res = await fetch('/api/telegram', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              subject: subject,
              userName: userName,
              userId: userId,
              batch: batch,
              photo_base64: this.selectedAnswerBase64
            })
          });

          let data = {};
          try {
            data = await res.json();
          } catch (jsonErr) {
            console.warn("Non-JSON response from /api/telegram:", jsonErr);
            data = { error: 'Server returned non-JSON response. Please check Vercel function logs.' };
          }

          if (!res.ok || data.error) {
            showToast(data.error || 'Failed to submit answer sheet', 'error');
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Retry Send';
              lucide.createIcons();
            }
            return;
          }

          const botUsername = data.botUsername || 'Evaluator Bot';
          SoundSystem.success();

          // Award 15 points for submitting mock
          if (this.currentUser && db) {
            db.collection('users').doc(this.currentUser.uid).update({
              points: firebase.firestore.FieldValue.increment(15)
            }).catch(() => {});
          }

          showToast(`Answer sent to @${botUsername} for checking`, 'success', 6000);
          document.getElementById('modal-container').innerHTML = '';

        } catch (netErr) {
          console.error("Network error submitting to /api/telegram:", netErr);
          showToast('Network error connecting to evaluation bot', 'error');
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Retry Send';
            lucide.createIcons();
          }
        }
      },

        if (sub !== 'ALL') {
          filtered = filtered.filter(item => (item.subject || '').toUpperCase().includes(sub));

        if (batch !== 'ALL') {
          filtered = filtered.filter(item => (item.batch || '').toLowerCase() === batch.toLowerCase());
        }

        if (filtered.length === 0) {
          box.innerHTML = `

          return `

      async sendChatMessage() {
        const input = document.getElementById('chat-input');
        if (!input) return;
        const text = input.value.trim();
        if (!text) return;

        input.value = '';
        SoundSystem.pop();

        const senderName = (this.currentUser && this.currentUser.name) || 'Student';
        const senderRole = (this.currentUser && this.currentUser.role) || 'Student';

        try {
          await db.collection('qp_messages').add({
            gcName: senderName,
            sender: senderName,
            senderRole: senderRole,
            message: text,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) {
          showToast('Failed to send message', 'error');

        if (!this.isAdminUser()) return;
        if (!confirm('Daily clean? All chats will be deleted permanently.')) return;
        SoundSystem.error();
        try {

        const cat = document.getElementById('supp-cat')?.value;

        if (!msg) {
          showToast('Please describe your issue', 'error');

        const btn = document.getElementById('supp-submit-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<span class="inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Submitting ticket...`;
        }

        try {
          const res = await fetch('/api/support', {

            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: (this.currentUser && this.currentUser.name) || 'Student',
              email: (this.currentUser && this.currentUser.email) || 'N/A',
              phone: (this.currentUser && this.currentUser.phone) || 'N/A',
              category: cat,
              subject: subj || 'Support Request',
              message: msg,
              userId: (this.currentUser && this.currentUser.uid) || 'Anonymous'
            })
          });

          const data = await res.json().catch(() => ({}));
          SoundSystem.success();
          showToast(`Ticket ${data.ticketId || ''} raised successfully to Support Bot!`, 'success', 6000);
          document.getElementById('modal-container').innerHTML = '';

          showToast('Failed to raise ticket. Please try again.', 'error');

        box.innerHTML = list.map(log => `
          <div class="p-2.5 rounded-2xl bg-[#090c22] border border-slate-800 text-[10px] space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-bold text-white text-xs">${escapeHtml(log.userName || 'Student')}</span>
              <span class="text-slate-500 font-mono">${formatDate(log.timestamp)}</span>
            </div>
            <div class="text-slate-400">
              📧 ${escapeHtml(log.email)} • 📞 ${escapeHtml(log.phone)}
            </div>
            <div class="flex items-center justify-between text-slate-500 pt-1 border-t border-slate-800/60">
              <span>📍 ${escapeHtml(log.city || 'Kolkata')} (${escapeHtml(log.userClass || '10')})</span>
              <span class="truncate max-w-[180px]" title="${escapeHtml(log.device)}">${escapeHtml(log.device)}</span>
            </div>
          </div>
        `).join('');
      },

      // --- 19. STREAK & POINTS MODALS ---
      openStreakModal() {
        const streak = (this.currentUser && this.currentUser.streak) || 1;
        alert(`🔥 Current Daily Streak: ${streak} Days!\n\nLog in every day to keep your streak alive and earn +10 bonus weekly points!`);
      },

      openPointsModal() {
        const points = (this.currentUser && this.currentUser.points) || 25;
        alert(`⭐ Weekly Points: ${points} Points!\n\nEarn points by attempting mock tests (+15 pts), uploading answer sheets (+15 pts), and maintaining streaks!`);
      },

      // --- 20. ADMIN CONTROL TAB (LEADERSHIP ONLY) ---
      loadAdminTab() {
        if (!this.isAdminUser()) {
          showToast('Access restricted to Leadership', 'error');
          this.switchTab('mocks');
          return;
        }

        const main = document.getElementById('main-content');
        main.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-sm font-extrabold text-white flex items-center gap-1.5 font-display uppercase tracking-wide">
                  <i data-lucide="shield-alert" class="w-4 h-4 text-amber-400"></i>
                  ADMIN CONTROL CENTER
                </h2>
                <p class="text-[10px] text-slate-400">Full Access • User Moderation & Batches</p>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40">
                ${(this.currentUser.role || 'ADMIN').toUpperCase()}
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="App.openBatchesModal()" class="p-4 rounded-2xl glass-card border border-cyan-500/40 text-left space-y-1">
                <i data-lucide="layers" class="w-5 h-5 text-cyan-400"></i>
                <div class="text-xs font-bold text-white">Manage Batches</div>
                <div class="text-[10px] text-slate-400">Create & organize groups</div>
              </button>
              <button onclick="App.openUserLogsModal()" class="p-4 rounded-2xl glass-card border border-amber-500/40 text-left space-y-1">
                <i data-lucide="clipboard-list" class="w-5 h-5 text-amber-400"></i>
                <div class="text-xs font-bold text-white">User Login Logs</div>
                <div class="text-[10px] text-slate-400">Track device activity</div>
              </button>
            </div>

            <div class="p-4 rounded-2xl glass-card border border-rose-500/30 space-y-2">
              <h3 class="text-xs font-bold text-rose-300 flex items-center gap-1.5">
                <i data-lucide="trash-2" class="w-4 h-4 text-rose-400"></i>
                Live Adda Quick Purge
              </h3>
              <p class="text-[11px] text-slate-400">Wipe all chat messages permanently across all devices.</p>
              <button onclick="App.purgeChats()" class="px-3 py-1.5 rounded-xl bg-rose-950/70 hover:bg-rose-900 border border-rose-500/40 text-rose-300 text-xs font-bold">
                Daily Clean Purge
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
      }
    };

    // BOOTSTRAP APP ON LOAD (NO SERVICE WORKER)
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
